<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1f2933;--mute:#6b7785;--line:#d9dee4;--pri:#1B2632;--acc:#F26B1D;--ok:#1a7f37;--bad:#cf222e;--badbg:#ffe5e5}
*{box-sizing:border-box}
body{margin:0;font-family:"Inter","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
header{background:var(--pri);color:#fff;padding:6px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .who{font-size:12px;color:#b8c2cc;white-space:nowrap}
header button{white-space:nowrap;padding:4px 12px;font-size:13px;border-radius:999px;background:rgba(255,255,255,.06);color:#e8edf2;border:1px solid rgba(255,255,255,.2);cursor:pointer}
header button:hover{background:rgba(255,255,255,.14)}
main{padding:8px;max-width:900px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.hint{font-size:12.5px;color:var(--mute);line-height:1.6}
.b{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.b:hover{background:#f3f5f8}
.b.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.b.pri:hover{background:#2b3a4a}
.b.dim{color:var(--mute);border:0;background:none;padding:4px 7px}
.b.dim:hover{color:var(--bad);background:var(--badbg)}
input{font:inherit;color:inherit;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff;max-width:100%}
input:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px rgba(242,107,29,.18)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mt10{margin-top:10px}
.hero{display:flex;align-items:baseline;gap:10px}
.hero .big{font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.hero .l{font-size:12.5px;color:var(--mute)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap;background:#f7f9fb}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;background:#f7f9fb;border-top:2px solid var(--line)}
.qty{width:88px;text-align:right}
.meta{font-size:11.5px;color:var(--mute);white-space:nowrap}
.err{background:var(--badbg);color:var(--bad);border:1px solid #f5c2c7;border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:13px}
.boot{padding:40px;text-align:center;color:var(--mute)}
.login{max-width:340px;margin:12vh auto;padding:0 16px}
.login .card{padding:20px}
.login h1{font-size:19px;margin:0 0 4px}
.login input{width:100%;margin-top:8px;padding:8px 10px}
.login button{width:100%;margin-top:12px;padding:9px}
.login .err{margin:10px 0 0}
@media(max-width:700px){.meta,th.hd,td.hd{display:none}main{padding:6px}th,td{padding:5px 6px}}
@media print{header,.noprint{display:none}}
</style>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
/* 共用資料庫：RT-Pmis-Supervision。publishable key 本來就是公開金鑰，
   資料表開了 RLS 且只允許已登入者存取。 */
const SB_URL = 'https://xbdchvmxgmypcyawavju.supabase.co';
const SB_KEY = 'sb_publishable_0uY_x4ZsMW5o0Gsp5wWPSg_31_-9ban';
const sb = supabase.createClient(SB_URL, SB_KEY);

const html = htm.bind(React.createElement);
const {useState, useEffect, useMemo, useCallback, useRef} = React;
const fmt = n => Number(n || 0).toLocaleString();
const pad = n => String(n).padStart(2, '0');
const when = ts => { if (!ts) return ''; const d = new Date(ts); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const zhSort = (a, b) => String(a).localeCompare(String(b), 'zh-Hant');

function Login() {
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const go = async e => {
    e.preventDefault(); setBusy(true); setErr('');
    const {error} = await sb.auth.signInWithPassword({email: email.trim(), password: pw});
    if (error) setErr(error.message === 'Invalid login credentials' ? '帳號或密碼不正確' : error.message);
    setBusy(false);
  };
  return html`<div class="login"><form class="card" onSubmit=${go}>
    <h1>資料夾採購統計</h1>
    <div class="hint">請用 RT-PMIS 的帳號登入</div>
    <input type="email" placeholder="電子郵件" value=${email} onChange=${e => setEmail(e.target.value)} autoComplete="username" required/>
    <input type="password" placeholder="密碼" value=${pw} onChange=${e => setPw(e.target.value)} autoComplete="current-password" required/>
    ${err && html`<div class="err">${err}</div>`}
    <button class="b pri" disabled=${busy}>${busy ? '登入中…' : '登入'}</button>
  </form></div>`;
}

/* 一個工程一列，只填數量。本地先改、離開欄位才寫回，避免打字途中被同事的即時更新蓋掉。 */
function Line({p, onSave}) {
  const [v, setV] = useState(p.qty == null ? '' : String(p.qty));
  const editing = useRef(false);
  useEffect(() => { if (!editing.current) setV(p.qty == null ? '' : String(p.qty)); }, [p.qty]);
  const commit = () => {
    editing.current = false;
    const t = v.trim();
    const qty = t === '' ? null : Math.max(0, parseInt(t, 10) || 0);
    if (qty === p.qty) { setV(p.qty == null ? '' : String(p.qty)); return; }
    onSave(p, qty);
  };
  return html`<tr>
    <td>${p.name}</td>
    <td class="n"><input class="qty" type="number" min="0" placeholder="—" value=${v}
      onChange=${e => { editing.current = true; setV(e.target.value); }}
      onBlur=${commit} onKeyDown=${e => { if (e.key === 'Enter') e.target.blur(); }}/></td>
    <td class="meta hd">${p.filled_by ? p.filled_by.split('@')[0] : ''}</td>
    <td class="meta hd">${when(p.updated_at)}</td>
  </tr>`;
}

function Main({session}) {
  const me = session.user.email || '';
  const [projects, setProjects] = useState([]);
  const [rows, setRows] = useState([]);
  const [extra, setExtra] = useState([]);
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    const [p, r] = await Promise.all([
      sb.from('projects').select('id,name').order('name'),
      sb.from('folder_requirements').select('*'),
    ]);
    const e = p.error || r.error;
    if (e) { setErr(e.message); setLoading(false); return; }
    setProjects(p.data); setRows(r.data); setLoading(false);
  }, []);
  useEffect(() => { load(); }, [load]);

  /* 同事改的數字即時出現 */
  useEffect(() => {
    const ch = sb.channel('folder-req')
      .on('postgres_changes', {event: '*', schema: 'public', table: 'folder_requirements'}, ev => {
        setRows(cur => {
          if (ev.eventType === 'DELETE') return cur.filter(x => x.id !== ev.old.id);
          const i = cur.findIndex(x => x.id === ev.new.id);
          if (i < 0) return [...cur, ev.new];
          const next = cur.slice(); next[i] = ev.new; return next;
        });
      }).subscribe();
    return () => { sb.removeChannel(ch); };
  }, []);

  /* 工程清單＝資料庫既有工程 ＋ 已填過的自訂案名 ＋ 這次新輸入的 */
  const list = useMemo(() => {
    const byName = new Map(rows.map(r => [r.project_name, r]));
    const names = new Map();
    projects.forEach(p => names.set(p.name, p.id));
    rows.forEach(r => { if (!names.has(r.project_name)) names.set(r.project_name, r.project_id || null); });
    extra.forEach(n => { if (!names.has(n)) names.set(n, null); });
    return [...names.entries()].map(([name, id]) => {
      const r = byName.get(name);
      return {name, id, qty: r ? r.qty : null, filled_by: r && r.filled_by, updated_at: r && r.updated_at};
    }).sort((a, b) => zhSort(a.name, b.name));
  }, [projects, rows, extra]);

  const total = list.reduce((s, p) => s + (p.qty || 0), 0);
  const filled = list.filter(p => p.qty != null).length;

  const save = async (p, qty) => {
    if (qty == null) {
      setRows(c => c.filter(x => x.project_name !== p.name));
      const {error} = await sb.from('folder_requirements').delete().eq('project_name', p.name);
      if (error) { setErr(error.message); load(); }
      return;
    }
    const rec = {project_id: p.id, project_name: p.name, qty, filled_by: me, updated_at: new Date().toISOString()};
    const {data, error} = await sb.from('folder_requirements')
      .upsert(rec, {onConflict: 'project_name'}).select().single();
    if (error) { setErr(error.message); load(); return; }
    setRows(c => { const i = c.findIndex(x => x.project_name === p.name); if (i < 0) return [...c, data]; const n = c.slice(); n[i] = data; return n; });
  };

  const addProject = () => { const n = prompt('工程名稱'); if (n && n.trim()) setExtra(x => x.includes(n.trim()) ? x : [...x, n.trim()]); };

  const xlsx = () => {
    const wb = XLSX.utils.book_new();
    const aoa = [['工程', '資料夾數量', '填報人', '更新時間'],
      ...list.filter(p => p.qty != null).map(p => [p.name, p.qty, p.filled_by || '', when(p.updated_at)]),
      ['合計', total, '', '']];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), '資料夾採購統計');
    const d = new Date();
    XLSX.writeFile(wb, `資料夾採購統計_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.xlsx`);
  };

  return html`<div>
    <header>
      <h1>資料夾採購統計</h1>
      <span class="who">${me}</span>
      <button onClick=${load}>重新整理</button>
      <button onClick=${() => sb.auth.signOut()}>登出</button>
    </header>
    <main>
      ${err && html`<div class="err" onClick=${() => setErr('')}>${err}（點一下關閉）</div>`}
      ${loading ? html`<div class="boot">載入中…</div>` : html`<div>
        <div class="card">
          <div class="hero"><div class="big">${fmt(total)}</div><div class="l">個資料夾　${filled}／${list.length} 個工程已填</div></div>
          <div class="row mt10 noprint">
            <button class="b pri" onClick=${xlsx}>匯出 Excel</button>
            <button class="b" onClick=${addProject}>＋ 其他工程</button>
          </div>
          <div class="hint mt10">每個工程填一個數量就好。填完離開欄位自動存檔，同事那邊即時看到；清空數字代表這個工程還沒填。</div>
        </div>
        <div class="card"><table>
          <thead><tr><th>工程</th><th class="n">數量</th><th class="hd">填報人</th><th class="hd">更新</th></tr></thead>
          <tbody>
            ${list.map(p => html`<${Line} key=${p.name} p=${p} onSave=${save}/>`)}
            <tr class="tot"><td>合計</td><td class="n">${fmt(total)}</td><td class="hd"></td><td class="hd"></td></tr>
          </tbody>
        </table></div>
      </div>`}
    </main>
  </div>`;
}

function App() {
  const [session, setSession] = useState(null);
  const [ready, setReady] = useState(false);
  useEffect(() => {
    sb.auth.getSession().then(({data}) => { setSession(data.session); setReady(true); });
    const {data} = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => data.subscription.unsubscribe();
  }, []);
  if (!ready) return html`<div class="boot">載入中…</div>`;
  return session ? html`<${Main} key=${session.user.id} session=${session}/>` : html`<${Login}/>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
