<style>

body{margin:0;font-family:"Inter","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}

<body>
<div id="root"></div>
<script>
'use strict';
/* ================= 連線設定 =================
   共用資料庫：RT-Pmis-Supervision。publishable key 本來就是公開金鑰，
   資料表都開了 RLS 且只允許已登入者存取，所以放在網頁裡是安全的。 */
const SB_URL = 'https://xbdchvmxgmypcyawavju.supabase.co';
const SB_KEY = 'sb_publishable_0uY_x4ZsMW5o0Gsp5wWPSg_31_-9ban';
const sb = supabase.createClient(SB_URL, SB_KEY);

const html = htm.bind(React.createElement);
const {useState, useEffect, useMemo, useCallback, useRef} = React;

const fmt = n => Number(n || 0).toLocaleString();
const pad = n => String(n).padStart(2, '0');
const when = ts => { if (!ts) return ''; const d = new Date(ts); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const NO_CAT = '（未填用途）';
const NO_SPEC = '（未填規格）';
/* 一列屬於哪個工程：選既有工程用 project_id，自行輸入的用名稱 */
const keyOf = r => r.project_id || 'name:' + r.project_name;
const pkey = p => p.id || 'name:' + p.name;
const zhSort = (a, b) => String(a).localeCompare(String(b), 'zh-Hant');

/* ================= 登入 ================= */
function Login() {
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const go = async e => {
    e.preventDefault();
    setBusy(true); setErr('');
    const {error} = await sb.auth.signInWithPassword({email: email.trim(), password: pw});
    if (error) setErr(error.message === 'Invalid login credentials' ? '帳號或密碼不正確' : error.message);
    setBusy(false);
  };
  return html`<div class="login"><form class="card" onSubmit=${go}>
    <h1>資料夾需求統計</h1>
    <div class="hint">請用 RT-PMIS 的帳號登入</div>
    <input type="email" placeholder="電子郵件" value=${email} onChange=${e => setEmail(e.target.value)} autoComplete="username" required/>
    <input type="password" placeholder="密碼" value=${pw} onChange=${e => setPw(e.target.value)} autoComplete="current-password" required/>
    ${err && html`<div class="err">${err}</div>`}
    <button class="b pri" disabled=${busy}>${busy ? '登入中…' : '登入'}</button>
  </form></div>`;
}

/* ================= 填報：單一列 =================
   本地先改、離開欄位才寫回資料庫，避免打字途中被別人的即時更新蓋掉。 */
function Line({r, cats, specs, onSave, onDel}) {
  const [d, setD] = useState(r);
  const editing = useRef(false);
  useEffect(() => { if (!editing.current) setD(r); }, [r]);
  const set = (k, v) => { editing.current = true; setD(x => ({...x, [k]: v})); };
  const commit = () => {
    editing.current = false;
    const qty = Math.max(0, parseInt(d.qty, 10) || 0);
    if (d.category === r.category && d.spec === r.spec && qty === r.qty && d.note === r.note) { setD(r); return; }
    onSave(r.id, {category: d.category.trim(), spec: d.spec.trim(), qty, note: d.note.trim()});
  };
  return html`<tr>
    <td><input list="cats" class="w100" value=${d.category} placeholder="用途" onChange=${e => set('category', e.target.value)} onBlur=${commit}/></td>
    <td><input list="specs" class="w100" value=${d.spec} placeholder="規格" onChange=${e => set('spec', e.target.value)} onBlur=${commit}/></td>
    <td class="n"><input type="number" min="0" class="qty" value=${d.qty} onChange=${e => set('qty', e.target.value)} onBlur=${commit}/></td>
    <td class="hd"><input class="w100" value=${d.note} placeholder="備註" onChange=${e => set('note', e.target.value)} onBlur=${commit}/></td>
    <td class="meta">${r.filled_by ? r.filled_by.split('@')[0] : ''}<br/>${when(r.updated_at)}</td>
    <td><button class="b dim" title="刪除" onClick=${() => onDel(r.id)}>✕</button></td>
  </tr>`;
}

/* ================= 填報頁 ================= */
function Fill({rows, projOpts, cats, specs, cur, setCur, onAdd, onSave, onDel}) {
  const mine = rows.filter(r => keyOf(r) === cur).sort((a, b) => a.created_at.localeCompare(b.created_at));
  const total = mine.reduce((s, r) => s + (+r.qty || 0), 0);
  const proj = projOpts.find(p => pkey(p) === cur);
  return html`<div>
    <div class="card">
      <div class="row">
        <select class="grow" value=${cur} onChange=${e => setCur(e.target.value)}>
          <option value="">— 選擇工程 —</option>
          ${projOpts.map(p => html`<option key=${pkey(p)} value=${pkey(p)}>${p.name}</option>`)}
        </select>
        <button class="b" onClick=${() => { const n = prompt('工程名稱'); if (n && n.trim()) setCur('new:' + n.trim()); }}>＋ 其他工程</button>
      </div>
      <div class="hint mt10">用途與規格可以直接打字，也可以點欄位從清單挑；挑清單裡的名稱大家統計才會合在一起。改完離開欄位就自動存檔，同事那邊會即時看到。</div>
    </div>
    ${!proj ? html`<div class="card hint">請先選一個工程。</div>` : html`<div class="card">
      <div class="row sb mb8">
        <div class="pname">${proj.name}</div>
        <div><span class="ok">小計 ${fmt(total)} 個</span></div>
      </div>
      <div class="tw"><table>
        <thead><tr><th>用途</th><th>規格</th><th class="n">數量</th><th class="hd">備註</th><th class="meta">填報</th><th></th></tr></thead>
        <tbody>
          ${mine.map(r => html`<${Line} key=${r.id} r=${r} cats=${cats} specs=${specs} onSave=${onSave} onDel=${onDel}/>`)}
          ${!mine.length && html`<tr><td colSpan="6" class="hint">還沒有資料，按下面「新增一列」開始填。</td></tr>`}
        </tbody>
      </table></div>
      <button class="b pri mt10" onClick=${() => onAdd(proj)}>＋ 新增一列</button>
    </div>`}
  </div>`;
}

/* ================= 彙總頁 ================= */
function Sum({rows, projOpts}) {
  const s = useMemo(() => {
    const byProj = new Map(), bySpec = new Map(), byCat = new Map(), people = new Set();
    let total = 0;
    rows.forEach(r => {
      const q = +r.qty || 0, sp = r.spec || NO_SPEC, ct = r.category || NO_CAT, k = keyOf(r);
      total += q;
      if (!byProj.has(k)) byProj.set(k, {name: r.project_name, total: 0, spec: {}});
      const p = byProj.get(k);
      p.total += q; p.spec[sp] = (p.spec[sp] || 0) + q;
      bySpec.set(sp, (bySpec.get(sp) || 0) + q);
      byCat.set(ct, (byCat.get(ct) || 0) + q);
      if (r.filled_by) people.add(r.filled_by);
    });
    const specCols = [...bySpec.keys()].sort(zhSort);
    const projList = [...byProj.values()].sort((a, b) => b.total - a.total || zhSort(a.name, b.name));
    return {
      total, specCols, projList, people: people.size,
      specList: specCols.map(k => [k, bySpec.get(k)]),
      catList: [...byCat.entries()].sort((a, b) => b[1] - a[1] || zhSort(a[0], b[0])),
    };
  }, [rows]);

  const xlsx = () => {
    const wb = XLSX.utils.book_new();
    const add = (name, aoa) => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), name);
    add('明細', [['工程', '用途', '規格', '數量', '備註', '填報人', '更新時間'],
      ...rows.map(r => [r.project_name, r.category, r.spec, +r.qty || 0, r.note, r.filled_by, when(r.updated_at)])]);
    add('各工程小計', [['工程', ...s.specCols, '合計'],
      ...s.projList.map(p => [p.name, ...s.specCols.map(c => p.spec[c] || 0), p.total]),
      ['合計', ...s.specCols.map(c => s.specList.find(x => x[0] === c)[1]), s.total]]);
    add('各規格小計', [['規格', '數量'], ...s.specList, ['合計', s.total]]);
    add('各用途小計', [['用途', '數量'], ...s.catList, ['合計', s.total]]);
    const d = new Date();
    XLSX.writeFile(wb, `資料夾需求統計_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.xlsx`);
  };

  if (!rows.length) return html`<div class="card hint">還沒有任何填報資料。</div>`;
  return html`<div>
    <div class="tiles">
      <div class="tile"><div class="l">資料夾總數</div><div class="v">${fmt(s.total)}</div></div>
      <div class="tile"><div class="l">工程數</div><div class="v">${s.projList.length}</div></div>
      <div class="tile"><div class="l">明細筆數</div><div class="v">${rows.length}</div></div>
      <div class="tile"><div class="l">填報人數</div><div class="v">${s.people}</div></div>
    </div>
    <div class="card noprint"><button class="b pri" onClick=${xlsx}>匯出 Excel（採購用）</button></div>

    <div class="card"><div class="sect">各工程 × 規格</div><div class="tw"><table>
      <thead><tr><th>工程</th>${s.specCols.map(c => html`<th key=${c} class="n">${c}</th>`)}<th class="n">合計</th></tr></thead>
      <tbody>
        ${s.projList.map(p => html`<tr key=${p.name}><td>${p.name}</td>
          ${s.specCols.map(c => html`<td key=${c} class="n">${p.spec[c] ? fmt(p.spec[c]) : ''}</td>`)}
          <td class="n"><b>${fmt(p.total)}</b></td></tr>`)}
        <tr class="tot"><td>合計</td>${s.specList.map(([k, v]) => html`<td key=${k} class="n">${fmt(v)}</td>`)}<td class="n">${fmt(s.total)}</td></tr>
      </tbody>
    </table></div></div>

    <div class="card"><div class="sect">各規格合計</div><div class="tw"><table>
      <thead><tr><th>規格</th><th class="n">數量</th></tr></thead>
      <tbody>${s.specList.map(([k, v]) => html`<tr key=${k}><td>${k}</td><td class="n">${fmt(v)}</td></tr>`)}
        <tr class="tot"><td>合計</td><td class="n">${fmt(s.total)}</td></tr></tbody>
    </table></div></div>

    <div class="card"><div class="sect">各用途合計</div><div class="tw"><table>
      <thead><tr><th>用途</th><th class="n">數量</th></tr></thead>
      <tbody>${s.catList.map(([k, v]) => html`<tr key=${k}><td>${k}</td><td class="n">${fmt(v)}</td></tr>`)}
        <tr class="tot"><td>合計</td><td class="n">${fmt(s.total)}</td></tr></tbody>
    </table></div></div>
  </div>`;
}

/* ================= 設定：用途／規格清單 ================= */
function OptList({title, kind, list, onAdd, onDel}) {
  const [v, setV] = useState('');
  const go = e => { e.preventDefault(); onAdd(kind, v); setV(''); };
  return html`<div class="card">
    <div class="sect">${title}</div>
    <div class="tags">${list.map(o => html`<span class="tag" key=${o.id}>${o.name}<button title="刪除" onClick=${() => onDel(o)}>✕</button></span>`)}</div>
    <form class="row mt10" onSubmit=${go}>
      <input class="grow" placeholder=${'新增' + title} value=${v} onChange=${e => setV(e.target.value)}/>
      <button class="b">新增</button>
    </form>
  </div>`;
}

/* ================= 主畫面 ================= */
function Main({session}) {
  const me = session.user.email || '';
  const [tab, setTab] = useState('fill');
  const [projects, setProjects] = useState([]);
  const [options, setOptions] = useState([]);
  const [rows, setRows] = useState([]);
  const [extra, setExtra] = useState([]);   // 這次自行輸入、還沒有明細的工程
  const [cur, setCur] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    const [p, o, r] = await Promise.all([
      sb.from('projects').select('id,name').order('name'),
      sb.from('folder_options').select('*').order('sort_order').order('name'),
      sb.from('folder_requirements').select('*').order('created_at'),
    ]);
    const e = p.error || o.error || r.error;
    if (e) { setErr(e.message); setLoading(false); return; }
    setProjects(p.data); setOptions(o.data); setRows(r.data); setLoading(false);
  }, []);
  useEffect(() => { load(); }, [load]);

  /* 即時同步：同事的新增／修改／刪除直接反映在畫面上 */
  useEffect(() => {
    const ch = sb.channel('folder-req')
      .on('postgres_changes', {event: '*', schema: 'public', table: 'folder_requirements'}, p => {
        setRows(cur => {
          if (p.eventType === 'DELETE') return cur.filter(x => x.id !== p.old.id);
          const i = cur.findIndex(x => x.id === p.new.id);
          if (i < 0) return [...cur, p.new];
          const next = cur.slice(); next[i] = p.new; return next;
        });
      }).subscribe();
    return () => { sb.removeChannel(ch); };
  }, []);

  const cats = useMemo(() => options.filter(o => o.kind === 'category'), [options]);
  const specs = useMemo(() => options.filter(o => o.kind === 'spec'), [options]);

  /* 工程清單＝資料庫既有工程 ＋ 明細裡出現過的自訂工程 ＋ 這次新輸入的 */
  const projOpts = useMemo(() => {
    const m = new Map();
    projects.forEach(p => m.set(p.id, {id: p.id, name: p.name}));
    rows.forEach(r => { const k = keyOf(r); if (!m.has(k)) m.set(k, {id: r.project_id, name: r.project_name}); });
    extra.forEach(n => { const k = 'name:' + n; if (!m.has(k)) m.set(k, {id: null, name: n}); });
    return [...m.values()].sort((a, b) => zhSort(a.name, b.name));
  }, [projects, rows, extra]);

  /* 「＋ 其他工程」先塞進 extra，再選起來 */
  useEffect(() => {
    if (!cur.startsWith('new:')) return;
    const n = cur.slice(4);
    setExtra(x => x.includes(n) ? x : [...x, n]);
    setCur('name:' + n);
  }, [cur]);

  const add = async proj => {
    const rec = {project_id: proj.id, project_name: proj.name, category: '', spec: '', qty: 1, note: '', filled_by: me};
    const {data, error} = await sb.from('folder_requirements').insert(rec).select().single();
    if (error) return setErr(error.message);
    setRows(c => c.some(x => x.id === data.id) ? c : [...c, data]);
  };
  const save = async (id, patch) => {
    const full = {...patch, filled_by: me};
    setRows(c => c.map(x => x.id === id ? {...x, ...full} : x));
    const {error} = await sb.from('folder_requirements').update(full).eq('id', id);
    if (error) { setErr(error.message); load(); }
  };
  const del = async id => {
    if (!confirm('刪除這一列？')) return;
    setRows(c => c.filter(x => x.id !== id));
    const {error} = await sb.from('folder_requirements').delete().eq('id', id);
    if (error) { setErr(error.message); load(); }
  };
  const addOpt = async (kind, name) => {
    name = String(name || '').trim();
    if (!name) return;
    const {data, error} = await sb.from('folder_options').insert({kind, name, sort_order: 900}).select().single();
    if (error) return setErr(error.code === '23505' ? '這個名稱已經在清單裡了' : error.message);
    setOptions(o => [...o, data]);
  };
  const delOpt = async o => {
    if (!confirm(`從清單移除「${o.name}」？已經填好的資料不會被刪掉。`)) return;
    setOptions(x => x.filter(y => y.id !== o.id));
    const {error} = await sb.from('folder_options').delete().eq('id', o.id);
    if (error) { setErr(error.message); load(); }
  };

  const T = [['fill', '填報'], ['sum', '彙總'], ['opt', '設定']];
  return html`<div>
    <header>
      <h1>資料夾需求統計</h1>
      <span class="who">${me}</span>
      <button onClick=${load}>重新整理</button>
      <button onClick=${() => sb.auth.signOut()}>登出</button>
    </header>
    <nav>${T.map(([k, t]) => html`<button key=${k} class=${tab === k ? 'on' : ''} onClick=${() => setTab(k)}>${t}</button>`)}</nav>
    <datalist id="cats">${cats.map(o => html`<option key=${o.id} value=${o.name}/>`)}</datalist>
    <datalist id="specs">${specs.map(o => html`<option key=${o.id} value=${o.name}/>`)}</datalist>
    <main>
      ${err && html`<div class="err" onClick=${() => setErr('')}>${err}（點一下關閉）</div>`}
      ${loading ? html`<div class="boot">載入中…</div>`
        : tab === 'fill' ? html`<${Fill} rows=${rows} projOpts=${projOpts} cats=${cats} specs=${specs} cur=${cur} setCur=${setCur} onAdd=${add} onSave=${save} onDel=${del}/>`
        : tab === 'sum' ? html`<${Sum} rows=${rows} projOpts=${projOpts}/>`
        : html`<div>
            <div class="card hint">這兩份清單是大家共用的下拉選項。從清單挑名稱，彙總才不會把同一種資料夾算成兩種。</div>
            <${OptList} title="用途" kind="category" list=${cats} onAdd=${addOpt} onDel=${delOpt}/>
            <${OptList} title="規格" kind="spec" list=${specs} onAdd=${addOpt} onDel=${delOpt}/>
          </div>`}
    </main>
  </div>`;
}

function App() {
  const [session, setSession] = useState(null);
  const [ready, setReady] = useState(false);
  useEffect(() => {
    sb.auth.getSession().then(({data}) => { setSession(data.session); setReady(true); });
    const {data} = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => data.subscription.unsubscribe();
  }, []);
  if (!ready) return html`<div class="boot">載入中…</div>`;
  return session ? html`<${Main} key=${session.user.id} session=${session}/>` : html`<${Login}/>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
