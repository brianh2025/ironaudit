<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1f2933;--mute:#6b7785;--line:#d9dee4;--pri:#1B2632;--pri2:#fdeee4;--acc:#F26B1D;--ok:#1a7f37;--okbg:#e6f4ea;--warn:#9a6700;--warnbg:#fff4d6;--bad:#cf222e;--badbg:#ffe5e5}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:#1B2632;color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0 8px 0 0}
header select{max-width:420px}
nav{display:flex;gap:2px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line);padding:0 12px;position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:10px 12px;cursor:pointer;font-size:14px;color:var(--mute);border-bottom:3px solid transparent}
nav button.on{color:var(--pri);border-bottom-color:var(--acc);font-weight:bold}
main{padding:16px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px}
.card h3{font-size:14px;margin:12px 0 6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px}
.kpi .l{color:var(--mute);font-size:12px}.kpi .v{font-size:22px;font-weight:bold;margin-top:4px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
label.f.wide{grid-column:1/-1}
input,select,textarea{font:inherit;padding:5px 7px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink)}
textarea{min-height:60px;resize:vertical}
button.b{font:inherit;padding:6px 12px;border-radius:5px;border:1px solid var(--line);background:#fff;cursor:pointer}
button.b:hover{background:#f0f3f6}
button.p{background:var(--pri);color:#fff;border-color:var(--pri)}button.p:hover{background:#2c3b4a}
button.d{color:var(--bad);border-color:#f0b4b8}
button.s{padding:2px 8px;font-size:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
th{background:#eef2f6;position:sticky;top:0}
td.n,th.n{text-align:right;white-space:nowrap}
tr.g td{background:#f7f9fb;font-weight:bold}
.tw{overflow:auto;max-height:70vh}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;white-space:nowrap}
.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}.mute{color:var(--mute)}
.msg{padding:8px 12px;border-radius:6px;margin:8px 0}
.split{display:grid;grid-template-columns:220px 1fr;gap:14px}
.list{max-height:72vh;overflow:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
.list div{padding:5px 8px;cursor:pointer;border-bottom:1px solid #eef1f4;display:flex;justify-content:space-between;gap:6px}
.list div.on{background:var(--pri2);font-weight:bold}
.list div.mh{position:sticky;top:0;background:#eef1f4;font-weight:bold;color:var(--pri);border-bottom:1px solid var(--line)}
.pick{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:5px;padding:4px;background:#fff}
.pick label{display:flex;gap:6px;font-size:13px;padding:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;z-index:20;overflow:auto}
.modal>.card{width:min(960px,100%)}
.empty{color:var(--mute);padding:20px;text-align:center}
@media(max-width:760px){.split{grid-template-columns:1fr}}
@media print{header,nav,.noprint{display:none}}
</style>

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = (n, w = 2) => String(n).padStart(w, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = fromISO(s); d.setDate(d.getDate() + n); return toISO(d); };
const dayDiff = (a, b) => Math.round((fromISO(b) - fromISO(a)) / 864e5);
const todayISO = () => toISO(new Date());
const WK = '日一二三四五六';
const wkday = s => WK[fromISO(s).getDay()];
const roc = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${+y - 1911}/${m}/${d}`; };
const mondayOf = s => { const d = fromISO(s); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return toISO(d); };
const num = v => { if (v == null || v === '') return NaN; if (typeof v === 'number') return v; const t = String(v).replace(/[,，\s%]/g, ''); return t === '' ? NaN : Number(t); };
const isNum = v => Number.isFinite(num(v));
const r4 = x => Math.round(x * 1e4) / 1e4;
const pct = (x, d = 2) => Number.isFinite(x) ? (x * 100).toFixed(d) + '%' : '—';
const money = x => Number.isFinite(x) ? Math.round(x).toLocaleString() : '—';
const fmtQ = x => Number.isFinite(x) ? (+x.toFixed(3)).toLocaleString() : '';
const norm = s => String(s ?? '').replace(/[\s　，,。．.、:：;；()（）\[\]【】「」'"＂]/g, '').replace(/[＜]/g, '<').replace(/[＞]/g, '>').replace(/[³]/g, '3').replace(/[²]/g, '2').toLowerCase();
const clean = s => String(s ?? '').replace(/\s+/g, '');

/* 各種日期寫法 → ISO（Date 物件、Excel 序號、115/8/3、115.08.03、2026-8-3、1150803） */
function parseAnyDate(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date && !isNaN(v)) { const d = new Date(v.getTime() + 12 * 36e5); return toISO(new Date(d.getFullYear(), d.getMonth(), d.getDate())); }
  if (typeof v === 'number') { if (v > 20000 && v < 80000) { const d = XLSX.SSF.parse_date_code(v); return `${d.y}-${pad(d.m)}-${pad(d.d)}`; } return null; }
  let s = String(v).trim().replace(/[年月]/g, '/').replace(/日.*$/, '').replace(/\(.+?\)|（.+?）/g, '').trim();
  let m = s.match(/^(\d{2,4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/);
  if (!m) { const k = s.match(/^(\d{3})(\d{2})(\d{2})$/); if (k) m = [0, k[1], k[2], k[3]]; }
  if (!m) return null;
  let y = +m[1]; if (y < 1911) y += 1911;
  const mo = +m[2], d = +m[3]; if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  return `${y}-${pad(mo)}-${pad(d)}`;
}

/* ================= 資料儲存層 =================
   目前以瀏覽器 IndexedDB 保存，每個專案一份文件。
   日後併入 RT-PMIS 時，只需把 Store 的四個函式換成 Supabase 呼叫。 */
const Store = (() => {
  let dbp;
  const db = () => dbp || (dbp = new Promise((res, rej) => {
    const q = indexedDB.open('smart-supervision', 1);
    q.onupgradeneeded = () => q.result.createObjectStore('projects', {keyPath: 'id'});
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  }));
  const tx = async (mode, fn) => { const d = await db(); return new Promise((res, rej) => { const t = d.transaction('projects', mode); const r = fn(t.objectStore('projects')); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); };
  return {
    list: () => tx('readonly', s => s.getAll()),
    put: doc => tx('readwrite', s => s.put(doc)),
    del: id => tx('readwrite', s => s.delete(id)),

/* ================= 共用元件 ================= */
function Field({f, rec, set, p}) {
  const v = rec[f.k];
  const on = e => set(f.k, f.type === 'number' ? (e.target.value === '' ? '' : +e.target.value) : f.type === 'check' ? e.target.checked : e.target.value);
  let ctl;
  if (f.type === 'textarea') ctl = html`<textarea value=${v || ''} onChange=${on} />`;
  else if (f.type === 'select') ctl = html`<select value=${v || ''} onChange=${on}>${(typeof f.options === 'function' ? f.options(rec) : f.options).map(o => html`<option key=${o} value=${o}>${o || '（未選）'}</option>`)}</select>`;
  else if (f.type === 'check') ctl = html`<span><input type="checkbox" checked=${!!v} onChange=${on} /> ${f.hint || ''}</span>`;
  else if (f.type === 'items') ctl = html`<${ItemsPick} p=${p} value=${v || []} date=${rec.date} onChange=${x => set(f.k, x)} />`;
  else { const lid = f.list ? 'dl_' + f.k : undefined;
    ctl = html`<span style=${{display: 'flex', gap: '4px'}}><input style=${{flex: 1}} type=${f.type || 'text'} list=${lid} value=${v ?? ''} onChange=${on} />
      ${f.list && html`<datalist id=${lid}>${(typeof f.list === 'function' ? f.list(rec) : f.list).map(o => html`<option key=${o} value=${o} />`)}</datalist>`}
      ${f.extra && f.extra(rec, set)}</span>`; }
  return html`<label className=${'f' + (f.wide || f.type === 'textarea' || f.type === 'items' ? ' wide' : '')}>${f.label}${ctl}</label>`;
}

function ItemsPick({p, value, onChange, date}) {
  const [q, setQ] = useState(''), [all, setAll] = useState(false);
  const worked = date && p.logs[date] ? Object.keys(p.logs[date].qty || {}) : [];
  const list = p.items.filter(x => (all || x.inspect || value.includes(x.code)) && (!q || norm(x.name + x.code).includes(norm(q))));
  const tog = c => onChange(value.includes(c) ? value.filter(x => x !== c) : [...value, c]);
  return html`<div>
    <div className="row" style=${{marginBottom: '4px'}}>
      <input placeholder="搜尋工項" value=${q} onChange=${e => setQ(e.target.value)} />
      <label><input type="checkbox" checked=${all} onChange=${e => setAll(e.target.checked)} /> 顯示全部工項</label>
      <button type="button" className="b s" disabled=${!worked.length} onClick=${() => onChange([...new Set([...value, ...worked.filter(c => p.items.find(x => x.code === c)?.inspect)])])}>帶入當日施工項目（${worked.length}）</button>
      <span className="mute">已選 ${value.length} 項</span>
    </div>
    <div className="pick">${list.map(x => html`<label key=${x.code}><input type="checkbox" checked=${value.includes(x.code)} onChange=${() => tog(x.code)} />
      <span className="mute">${x.code}</span> ${x.name} ${worked.includes(x.code) && html`<span className="tag warn">當日施工</span>`}</label>`)}
      ${!list.length && html`<div className="mute">無符合工項（請先匯入契約詳細價目表）</div>`}</div></div>`;
}

function Modal({title, onClose, children}) {
  return html`<div className="modal" onMouseDown=${e => e.target === e.currentTarget && onClose()}><div className="card">
    <div className="row" style=${{justifyContent: 'space-between'}}><h2>${title}</h2><button className="b" onClick=${onClose}>關閉</button></div>${children}</div></div>`;
}

const Tag = ({s}) => s === 'ok' ? html`<span className="tag ok">已查驗</span>` : s === 'part' ? html`<span className="tag warn">部分未查驗</span>` : html`<span className="tag bad">未查驗</span>`;

  const W = 760, H = 240, M = 36, X = d => M + (W - 2 * M) * Math.min(1, Math.max(0, dayDiff(s, d) / di.total)), Y = v => H - M + (M * 2 - H) * v;
  const sp = [{date: addDays(s, -1), cum: 0}, ...p.schedule]; const act = C.series.filter(x => x.date <= (C.last?.date || ''));
  const line = (pts, k) => pts.map(x => `${X(x.date).toFixed(1)},${Y(x[k]).toFixed(1)}`).join(' ');
  return html`<svg viewBox=${`0 0 ${W} ${H}`} style=${{width: '100%', maxWidth: W + 'px'}}>
    ${[0, .25, .5, .75, 1].map(v => html`<g key=${v}><line x1=${M} x2=${W - M} y1=${Y(v)} y2=${Y(v)} stroke="#e3e7ec" /><text x=${M - 4} y=${Y(v) + 4} fontSize="10" textAnchor="end" fill="#6b7785">${v * 100}%</text></g>`)}
    <text x=${M} y=${H - 12} fontSize="10" fill="#6b7785">${roc(s)}</text><text x=${W - M} y=${H - 12} fontSize="10" textAnchor="end" fill="#6b7785">${roc(di.end)}</text>
    ${p.schedule.length > 0 && html`<polyline points=${line(sp, 'cum')} fill="none" stroke="#9aa5b1" strokeWidth="2" strokeDasharray="5 4" />`}

    <g fontSize="11"><line x1=${W - 220} x2=${W - 196} y1=${M - 14} y2=${M - 14} stroke="#9aa5b1" strokeWidth="2" strokeDasharray="5 4" /><text x=${W - 192} y=${M - 10}>預定</text>
    <line x1=${W - 150} x2=${W - 126} y1=${M - 14} y2=${M - 14} stroke="#1f6feb" strokeWidth="2.5" /><text x=${W - 122} y=${M - 10}>實際</text></g></svg>`;
}

/* 名稱對不到的工項：列出建議對應，使用者確認後併入並記住 */
function UnmatchedMap({list, items, amap, setAmap}) {
  const g = {}; list.forEach(u => { const k = norm(u.name); (g[k] = g[k] || {name: u.name, unit: u.unit, q: 0, days: new Set()}); g[k].q += u.q; g[k].days.add(u.date); });
  return html`<div className="msg warn"><b>以下名稱與契約項目不完全相同，請確認對應（選好後按確認匯入，下次會自動對應）：</b>
    <table style=${{marginTop: '6px', background: '#fff'}}><thead><tr><th>日誌上的名稱</th><th>單位</th><th className="n">合計數量</th><th className="n">天數</th><th>對應契約項目</th></tr></thead><tbody>
    ${Object.entries(g).map(([k, x]) => html`<tr key=${k}><td>${x.name}</td><td>${x.unit}</td><td className="n">${fmtQ(x.q)}</td><td className="n">${x.days.size}</td>
      <td><select style=${{maxWidth: '360px'}} value=${amap[k] || ''} onChange=${e => setAmap({...amap, [k]: e.target.value})}><option value="">（不匯入）</option>
        ${items.map(it => html`<option key=${it.code} value=${it.code}>${it.code} ${it.name}（${it.unit}）</option>`)}</select></td></tr>`)}
    </tbody></table></div>`;
}
/* 相似度（字元二元組 Dice 係數）＋單位相同加分，取最接近的契約項目 */
function suggestItem(items, name, unit) {
  const bg = s => { const t = norm(s).replace(/祛/g, '袪'), a = new Map(); for (let i = 0; i < t.length - 1; i++) { const k = t.slice(i, i + 2); a.set(k, (a.get(k) || 0) + 1); } return [a, Math.max(1, t.length - 1)]; };
  const [A, na] = bg(name); let best = null, bs = 0;
  for (const it of items) { const [B, nb] = bg(it.name); let o = 0; A.forEach((v, k) => o += Math.min(v, B.get(k) || 0));
    const sc = 2 * o / (na + nb) + (unit && norm(unit) === norm(it.unit) ? 0.1 : 0); if (sc > bs) { bs = sc; best = it; } }
  return bs >= 0.45 ? best : null;
}

function LogTab({p, C, update}) {
  const di0 = dayInfo(p, p.info.startDate);
  const lastD = [todayISO(), ...Object.keys(p.logs)].sort().pop();
  const endD = lastD < p.info.startDate ? p.info.startDate : lastD;
  const dates = useMemo(() => { const a = []; if (!p.info.startDate) return a; for (let d = p.info.startDate; d <= endD && a.length < 2000; d = addDays(d, 1)) a.push(d); return a.reverse(); }, [p.info.startDate, endD]);
  const [sel, setSel] = useState(C.last?.date || dates[0]), [all, setAll] = useState(false);
  const l = p.logs[sel] || blankLog(), s = C.byDate[sel], di = dayInfo(p, sel);
  const up = fn => update(d => { d.logs[sel] = d.logs[sel] || blankLog(); fn(d.logs[sel]); });
  const setQ = (code, v) => up(x => { const n = parseFloat(v); if (!v || !n) delete x.qty[code]; else x.qty[code] = n; });
  const prevCum = code => Object.keys(p.logs).filter(d => d < sel).reduce((a, d) => a + (p.logs[d].qty?.[code] || 0), 0);
  const W = ['', '晴', '陰', '雨', '颱風', '豪雨', '停工'];
  let g = null;
  const items = p.items.filter(x => x.kind === 'normal' && (all || l.qty?.[x.code]));
  const months = useMemo(() => { const m = []; for (const d of dates) { const k = d.slice(0, 7); if (!m.length || m.at(-1).k !== k) m.push({k, ds: []}); m.at(-1).ds.push(d); } return m; }, [dates]);
  const [open, setOpen] = useState({});
  if (!p.info.startDate) return html`<div className="empty">請先於「專案設定」填寫開工日期</div>`;
  return html`<div className="split">
    <div className="list">${months.map(m => { const isOpen = open[m.k] ?? m.k === sel.slice(0, 7), n = m.ds.filter(d => Object.keys(p.logs[d]?.qty || {}).length).length;
      return html`<${React.Fragment} key=${m.k}><div className="mh" onClick=${() => setOpen({...open, [m.k]: !isOpen})}><span>${isOpen ? '▼' : '▶'} ${+m.k.slice(0, 4) - 1911}年${+m.k.slice(5)}月</span><span className="mute">${n} 天有日誌</span></div>
        ${isOpen && m.ds.map(d => { const x = p.logs[d]; const has = x && Object.keys(x.qty || {}).length; return html`<div key=${d} className=${d === sel ? 'on' : ''} onClick=${() => setSel(d)}>
          <span>${roc(d)}（${wkday(d)}）</span><span>${has ? html`<span className="tag ok">${Object.keys(x.qty).length}項</span>` : x && (x.summary || x.wAm) ? html`<span className="tag">記事</span>` : ''}</span></div>`; })}<//>`; })}</div>
    <div>
      <div className="card"><div className="row" style=${{justifyContent: 'space-between'}}><h2>${roc(sel)}（${wkday(sel)}）施工日誌</h2>
        <span className="mute">第 ${di.used} 天／契約 ${di.total} 天，剩餘 ${di.left} 天</span></div>
        <div className="kpis">
          <div className="kpi"><div className="l">本日完成金額</div><div className="v">${money(s?.amt || 0)}</div></div>
          <div className="kpi"><div className="l">本日實際進度</div><div className="v">${pct(s?.day || 0)}</div></div>
          <div className="kpi"><div className="l">累計實際進度</div><div className="v">${pct(s?.cum ?? NaN)}</div></div>
          <div className="kpi"><div className="l">累計預定進度</div><div className="v">${pct(schedAt(p, sel))}</div></div></div>
        <div className="grid" style=${{marginTop: '10px'}}>
          <label className="f">上午天氣<select value=${l.wAm} onChange=${e => up(x => x.wAm = e.target.value)}>${W.map(w => html`<option key=${w}>${w}</option>`)}</select></label>
          <label className="f">下午天氣<select value=${l.wPm} onChange=${e => up(x => x.wPm = e.target.value)}>${W.map(w => html`<option key=${w}>${w}</option>`)}</select></label>
          ${[['summary', '施工概況'], ['safety', '職安衛督導'], ['tests', '取樣試驗紀錄'], ['notify', '通知協力廠商辦理事項'], ['notes', '重要事項紀錄']].map(([k, t]) =>
            html`<label key=${k} className="f wide">${t}<textarea value=${l[k] || ''} onChange=${e => { const v = e.target.value; up(x => x[k] = v); }} /></label>`)}
        </div>
        <h3>出工人數／機具</h3>
        <div className="row">${[...p.settings.labor.map(k => ['labor', k]), ...p.settings.machines.map(k => ['machines', k])].map(([grp, k]) =>
          html`<label key=${grp + k} className="f">${k}<input type="number" min="0" style=${{width: '80px'}} value=${l[grp]?.[k] ?? ''} onChange=${e => { const v = +e.target.value; up(x => { x[grp] = x[grp] || {}; if (v) x[grp][k] = v; else delete x[grp][k]; }); }} /></label>`)}</div>
      </div>
      <div className="card"><div className="row" style=${{justifyContent: 'space-between'}}><h2>本日完成數量</h2>
        <label><input type="checkbox" checked=${all} onChange=${e => setAll(e.target.checked)} /> 顯示全部工項以填報</label></div>
        ${items.length ? html`<div className="tw"><table><thead><tr><th>代碼</th><th>工程項目</th><th>單位</th><th className="n">契約數量</th><th className="n">前日累計</th><th className="n">本日完成</th><th className="n">本日金額</th><th className="n">累計完成率</th></tr></thead><tbody>
          ${items.flatMap(it => { const o = []; if (it.group !== g) { g = it.group; o.push(html`<tr className="g" key=${'g' + it.code}><td colSpan="8">${it.gseq}　${it.group}</td></tr>`); }
            const pc = prevCum(it.code), q = l.qty?.[it.code] || 0;
            o.push(html`<tr key=${it.code}><td className="mute">${it.code}</td><td>${it.name}</td><td>${it.unit}</td><td className="n">${fmtQ(it.qty)}</td><td className="n">${fmtQ(pc)}</td>
              <td className="n"><input key=${sel + it.code} type="number" step="any" min="0" style=${{width: '90px', textAlign: 'right'}} defaultValue=${q || ''} onChange=${e => setQ(it.code, e.target.value)} /></td>
              <td className="n">${q ? money(q * it.price) : ''}</td><td className="n"><span className=${pc + q > it.qty ? 'tag bad' : ''}>${pct(it.qty ? (pc + q) / it.qty : 0, 1)}</span></td></tr>`); return o; })}
        </tbody></table></div>` : html`<div className="empty">本日無完成數量${p.items.length ? '，勾選「顯示全部工項」即可填報' : '（請先匯入契約項目）'}</div>`}
      </div></div></div>`;
}

      ${A.rows.length ? html`<div className="tw"><table><thead><tr><th>代碼</th><th>工項</th><th>本週施工日</th><th className="n">本週數量</th><th>查驗表單號</th><th>稽核結果</th><th>未查驗日</th><th className="noprint"></th></tr></thead><tbody>

          <td>${r.nos.join('、')}</td><td><${Tag} s=${r.status} /></td><td>${r.missDays.map(d => roc(d).slice(4)).join('、')}</td>
          <td className="noprint">${r.status !== 'ok' && html`<button className="b s" onClick=${() => quick({items: [r.it.code], date: r.missDays[0], type: '施工查驗'})}>補填查驗</button>`}</td></tr>`)}
      </tbody></table></div>` : html`<div className="empty">本週施工日誌無需查驗工項的完成數量</div>`}</div>
    <div className="grid" style=${{gridTemplateColumns: 'repeat(auto-fill,minmax(360px,1fr))'}}>
      <div className="card"><h2>試驗報告未回填（截至週日）</h2>${A.pendingTests.length ? html`<table><tbody>${A.pendingTests.map(t => html`<tr key=${t.r.id}><td>${t.r.no}</td><td>${t.r.testName}</td><td>${roc(t.r.sampleDate || t.r.date)}</td><td className="n"><span className=${t.age > p.settings.testDue ? 'tag bad' : ''}>${t.age} 天</span></td></tr>`)}</tbody></table>` : html`<div className="mute">無</div>`}</div>
      <div className="card"><h2>本週表單填報</h2><table><tbody>${Object.entries(A.forms).map(([k, v]) => html`<tr key=${k}><td>${k}</td><td className="n">${v} 件</td><td>${!v && (k !== '防汛' || A.flood) ? html`<span className="tag warn">本週未填報</span>` : ''}</td></tr>`)}
        <tr><td>技師督導／查核</td><td className="n">${A.sup.length} 件</td><td></td></tr></tbody></table>
        ${A.flood && html`<div className="mute" style=${{marginTop: '6px'}}>目前為防汛期（5～11 月），建議每週至少一次防汛檢查。</div>`}</div>
      <div className="card"><h2>進場材料未查驗</h2>${A.noEntry.length ? html`<table><tbody>${A.noEntry.map((e, i) => html`<tr key=${i}><td>${roc(e.date)}</td><td>${e.text}</td><td className="noprint"><button className="b s" onClick=${() => quick({date: e.date, type: '材料查驗', content: e.text})}>補填查驗</button></td></tr>`)}</tbody></table>` : html`<div className="mute">無</div>`}
        <div className="mute" style=${{marginTop: '6px'}}>依施工概況載明「進場」、當日卻沒有對應材料查驗紀錄者。</div></div>
      <div className="card"><h2>有計數量、施工項目卻未載明</h2>${A.noWork.length ? html`<table><tbody>${A.noWork.map((e, i) => html`<tr key=${i}><td>${roc(e.date)}</td><td>${e.cat}</td><td>${e.items.join('；')}</td><td><span className="tag bad">施工未自檢或數量虛報</span></td></tr>`)}</tbody></table>` : html`<div className="mute">無</div>`}
        <div className="mute" style=${{marginTop: '6px'}}>完成數量有模板、鋼筋或混凝土，施工概況卻沒寫對應施工項目。</div></div>
      <div className="card"><h2>記事載明查驗、施工項目未載明</h2>${A.claims.length ? html`<table><tbody>${A.claims.map(e => html`<tr key=${e.id}><td>${roc(e.date)}</td><td>${e.cat}</td><td>${e.text}</td><td><span className="tag bad">未建查驗</span></td></tr>`)}</tbody></table>` : html`<div className="mute">無</div>`}
        <div className="mute" style=${{marginTop: '6px'}}>廠商記事欄寫有模板、鋼筋、混凝土施工查驗，但當天施工概況沒有該項施工項目，因此不建立查驗紀錄。</div></div>
      <div className="card"><h2>不合格未改善</h2>${A.failOpen.length ? html`<table><tbody>${A.failOpen.map(r => html`<tr key=${r.id}><td>${r.no}</td><td>${roc(r.date)}</td><td>${shortList(itemNames(p, r.items))}</td></tr>`)}</tbody></table>` : html`<div className="mute">無</div>`}</div>
    </div></div>`;
}
/* ================= 專案設定／匯出備份 ================= */
function SettingsTab({p, update, onDelete, onRestore}) {

  const S = (k, label) => html`<label className="f">${label}<input type="number" value=${p.settings[k]} onChange=${e => { const v = +e.target.value; update(d => { d.settings[k] = v; }); }} /></label>`;
  const backup = () => downloadBlob(new Blob([JSON.stringify(p, null, 1)], {type: 'application/json'}), `${p.info.name || '專案'}_備份_${todayISO().replace(/-/g, '')}.json`);
  return html`<div>
    <div className="card"><h2>匯出與備份</h2><div className="row">
      <button className="b p" onClick=${() => exportLinkedExcel(p).catch(e => alert('匯出失敗：' + e.message))} disabled=${!p.items.length}>匯出整合連動版 Excel（給廠商填用）</button>
      <button className="b" onClick=${backup}>下載專案備份（JSON）</button>
      <label className="b" style=${{cursor: 'pointer'}}>還原／匯入備份…<input type="file" accept=".json" style=${{display: 'none'}} onChange=${async e => { const f = e.target.files[0]; e.target.value = ''; if (f) onRestore(JSON.parse(await f.text())); }} /></label></div>
      <div className="mute" style=${{marginTop: '8px'}}>資料存在本瀏覽器。換電腦或與同事共用時，請下載 JSON 備份放到共用雲端硬碟，對方以「還原／匯入備份」讀入。廠商填回的整合連動版，可在「資料匯入 ①」直接匯回。</div></div>
    <div className="card"><h2>工程資料</h2><div className="grid">
      ${I('name', '工程名稱')}${I('contractNo', '契約編號')}${I('owner', '主辦機關')}${I('supervisor', '監造單位')}${I('contractor', '承攬廠商')}${I('location', '施工地點')}
      ${I('startDate', '開工日期', 'date')}${I('duration', '契約工期（日曆天）', 'number')}${I('extendDays', '展延天數', 'number')}${I('amount', '契約金額（元）', 'number')}</div></div>
    <div className="card"><h2>稽核與編號設定</h2><div className="grid">
      ${S('tolerance', '查驗比對容許天數（±天）')}${S('testDue', '試驗報告回填期限（天）')}
      ${Object.keys(DEFAULT_PREFIX).map(k => html`<label key=${k} className="f">表單號前綴：${k}<input value=${p.settings.prefix[k] || ''} onChange=${e => { const v = e.target.value; update(d => { d.settings.prefix[k] = v; }); }} /></label>`)}
      ${[['labor', '出工工別（以、分隔）'], ['machines', '機具名稱（以、分隔）']].map(([k, t]) => html`<label key=${k} className="f wide">${t}<input defaultValue=${p.settings[k].join('、')} onBlur=${e => { const v = e.target.value.split(/[、,，]/).map(s => s.trim()).filter(Boolean); update(d => { d.settings[k] = v; }); }} /></label>`)}
    </div></div>
    <div className="card"><h2>刪除專案</h2><button className="b d" onClick=${onDelete}>刪除此專案…</button></div></div>`;
}

/* ================= 主程式 ================= */
const TABS = [['home', '總覽'], ['import', '資料匯入'], ['items', '契約項目'], ['log', '施工日誌'], ['insp', '查驗填報'], ['tests', '試驗回填'], ['tech', '技師督導'], ['check', '查核／團體督導'], ['forms', '職安衛／環保／交維／防汛'], ['audit', '每週稽核'], ['set', '專案設定／匯出']];
/* ================= Google 雲端硬碟一鍵導入 =================
   父資料夾下每個子資料夾＝一個專案；讀取其中「監造日報」子資料夾的 Excel，解析工程資料、契約項目、預定進度、施工日誌。 */
const seqCmp = (a, b) => String(a).localeCompare(String(b), 'zh-Hant', {numeric: true}); // 依名稱開頭序號（數字大小）排列
const DRIVE_API = 'https://www.googleapis.com/drive/v3/files';
const loadGis = () => window.google?.accounts?.oauth2 ? Promise.resolve() : new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.onload = res; s.onerror = () => rej(new Error('無法載入 Google 登入元件（需連網）')); document.head.appendChild(s); });
const driveToken = async clientId => { await loadGis(); return new Promise((res, rej) => { const t = google.accounts.oauth2.initTokenClient({client_id: clientId, scope: 'https://www.googleapis.com/auth/drive.readonly',
  callback: r => r.access_token ? res(r.access_token) : rej(new Error(r.error_description || r.error || '授權失敗')), error_callback: e => rej(new Error(e.message || e.type))}); t.requestAccessToken(); }); };
async function driveFetch(tok, url) { const r = await fetch(url, {headers: {Authorization: 'Bearer ' + tok}}); if (!r.ok) throw new Error(`Drive ${r.status}：${(await r.text()).slice(0, 160)}`); return r; }
async function driveList(tok, parentId, extra = '') {
  const out = []; let pt = '';
  do { const q = encodeURIComponent(`'${parentId}' in parents and trashed=false${extra}`);
    const j = await (await driveFetch(tok, `${DRIVE_API}?q=${q}&fields=nextPageToken,files(id,name,mimeType,modifiedTime)&pageSize=1000&supportsAllDrives=true&includeItemsFromAllDrives=true${pt ? '&pageToken=' + pt : ''}`)).json();
    out.push(...j.files); pt = j.nextPageToken || ''; } while (pt);
  return out;
}
const FOLDER = 'application/vnd.google-apps.folder', GSHEET = 'application/vnd.google-apps.spreadsheet';
async function driveFile(tok, f) {
  const url = f.mimeType === GSHEET ? `${DRIVE_API}/${f.id}/export?mimeType=${encodeURIComponent('application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')}` : `${DRIVE_API}/${f.id}?alt=media&supportsAllDrives=true`;
  return new File([await (await driveFetch(tok, url)).blob()], f.name);
}
/* 依「整合活頁簿一鍵匯入」邏輯解析多個 Excel，回傳可直接套用的內容 */
async function parseReportFiles(files, p) {
  const out = {info: {}, items: null, schedule: null, logs: null, records: null, notes: []};
  for (const f of files) {
    try {
      const wb = await readWB(f); out.info = {...parseInfo(wb), ...out.info};
      const c = parseContract(wb); if (c) out.items = c;
      const sc = parseSchedule(wb); if (sc) out.schedule = sc;
      const L = parseLogs(wb, out.items?.items || p.items);
      const R = parseRecords(wb, out.items?.items || p.items, L.logs); if (R) { out.records = out.records || {inspections: [], supervisions: [], forms: [], flags: []}; for (const k in R) out.records[k].push(...R[k]); }
      if (Object.keys(L.logs).length) { out.logs = out.logs || {logs: {}, unmatched: []}; Object.assign(out.logs.logs, L.logs); out.logs.unmatched.push(...L.unmatched); }
    } catch (e) { out.notes.push(`${f.name} 解析失敗：${e.message}`); }
  }
  return out;
}
function applyReport(d, r) {
  for (const k in r.info) if (r.info[k] !== '' && r.info[k] != null && k !== 'name') d.info[k] = r.info[k];
  if (r.items) d.items = r.items.items;
  if (r.schedule) d.schedule = r.schedule.points;
  if (r.records) mergeRecords(d, r.records);
  if (r.logs) for (const [dt, l] of Object.entries(r.logs.logs)) {
    for (const g of ['labor', 'machines']) for (const k in l[g]) if (!d.settings[g].includes(k)) d.settings[g].push(k);
    d.logs[dt] = {...blankLog(), ...l};
  }
}
function DriveImport({existing, onCreate, onClose}) {
  const [cid, setCid] = useState(localStorage.getItem('ss.gcid') || ''), [root, setRoot] = useState(localStorage.getItem('ss.groot') || '');
  const [log, setLog] = useState([]), [busy, setBusy] = useState(false);
  const say = m => setLog(l => [...l, m]);
  const go = async () => {
    const rid = (root.match(/folders\/([\w-]+)/) || root.match(/[?&]id=([\w-]+)/) || [, root.trim()])[1];
    if (!cid.trim() || !rid) return alert('請填入 OAuth Client ID 與父資料夾網址／ID');
    localStorage.setItem('ss.gcid', cid.trim()); localStorage.setItem('ss.groot', root.trim()); setBusy(true); setLog([]);
    try {
      say('登入 Google…'); const tok = await driveToken(cid.trim());
      const subs = (await driveList(tok, rid, ` and mimeType='${FOLDER}'`)).sort((a, b) => seqCmp(a.name, b.name));
      say(`找到 ${subs.length} 個子資料夾`); let made = 0; const names = new Set(existing.map(x => x.info.name));
      for (const sub of subs) {
        if (names.has(sub.name)) { say(`略過（專案已存在）：${sub.name}`); continue; }
        const p = newProject(sub.name);
        const rpt = (await driveList(tok, sub.id, ` and mimeType='${FOLDER}'`)).find(f => /監造日報/.test(f.name));
        if (!rpt) say(`${sub.name}：沒有「監造日報」資料夾，只建立空專案`);
        else {
          const fs = (await driveList(tok, rpt.id)).filter(f => (f.mimeType === GSHEET || /\.(xlsx|xlsm|xls)$/i.test(f.name)) && !f.name.startsWith('~$')).sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
          say(`${sub.name}：讀取 ${fs.length} 個監造報表…`);
          const files = []; for (const f of fs) files.push(await driveFile(tok, f));
          const r = await parseReportFiles(files, p); applyReport(p, r); r.notes.forEach(say);
          say(`　→ 契約項目 ${p.items.length}、預定進度 ${p.schedule.length} 點、施工日誌 ${Object.keys(p.logs).length} 天、各項填報 ${p.inspections.length + p.supervisions.length + p.forms.length} 筆` + (r.logs?.unmatched.length ? `（${r.logs.unmatched.length} 筆數量未對應工項）` : ''));
        }
        await onCreate(p); names.add(sub.name); made++;
      }
      say(`完成：新建立 ${made} 個專案`);
    } catch (e) { say('失敗：' + e.message); console.error(e); }
    setBusy(false);
  };
  return html`<${Modal} title="從 Google 雲端硬碟一鍵導入專案" onClose=${onClose}>
    <div className="mute" style=${{marginBottom: '8px'}}>父資料夾底下每個子資料夾＝一個專案（名稱即專案名稱）；讀取其中「監造日報」資料夾內的 Excel 解析匯入。已存在同名專案會略過。只需唯讀權限。</div>
    <label>OAuth Client ID（Google Cloud 建立「網頁應用程式」，已授權的 JavaScript 來源加入 ${location.origin}）<input style=${{width: '100%'}} value=${cid} onChange=${e => setCid(e.target.value)} placeholder="xxxx.apps.googleusercontent.com" /></label>
    <label>父資料夾網址或 ID<input style=${{width: '100%'}} value=${root} onChange=${e => setRoot(e.target.value)} placeholder="https://drive.google.com/drive/folders/..." /></label>
    <div style=${{margin: '10px 0'}}><button className="b p" disabled=${busy} onClick=${go}>${busy ? '導入中…' : '登入並一鍵導入'}</button></div>
    <pre style=${{whiteSpace: 'pre-wrap', maxHeight: '260px', overflow: 'auto', fontSize: '12px'}}>${log.join('\n')}</pre>
  <//>`;
}

function App() {
  const [projects, setProjects] = useState(null), [cur, setCur] = useState(null), [tab, setTab] = useState('home'), [preset, setPreset] = useState(null), [drv, setDrv] = useState(false);
  useEffect(() => { Store.list().then(l => { l.forEach(x => { if (migrateProject(x)) Store.put(x); }); setProjects(l); const last = localStorage.getItem('ss.cur'); setCur((l.find(x => x.id === last) || l[0])?.id || null); }); }, []);
  const p = projects?.find(x => x.id === cur);
  const saveT = useRef({});
  const update = fn => setProjects(ps => ps.map(x => { if (x.id !== cur) return x; const n = structuredClone(x); fn(n); n.updated = new Date().toISOString();
    clearTimeout(saveT.current[n.id]); saveT.current[n.id] = setTimeout(() => Store.put(n), 400); return n; }));
  useEffect(() => { if (cur) localStorage.setItem('ss.cur', cur); }, [cur]);
  const C = useMemo(() => p ? calc(p) : null, [p]);
  const create = async () => { const name = prompt('專案（工程）名稱：'); if (!name) return; const n = newProject(name); await Store.put(n); setProjects(ps => [...ps, n]); setCur(n.id); setTab('import'); };
  const del = async () => { if (!confirm(`確定刪除「${p.info.name}」？所有匯入資料與填報紀錄都會刪除，建議先下載 JSON 備份。`)) return; await Store.del(p.id); const rest = projects.filter(x => x.id !== p.id); setProjects(rest); setCur(rest[0]?.id || null); setTab('home'); };
  const restore = async doc => { if (!doc?.info || !doc.items) return alert('不是有效的專案備份檔'); const exist = projects.some(x => x.id === doc.id);
    if (exist && !confirm('已有相同專案，要以備份內容覆蓋嗎？')) return; const n = {...newProject(), ...doc, settings: {...newProject().settings, ...doc.settings}}; migrateProject(n); await Store.put(n);
    setProjects(ps => exist ? ps.map(x => x.id === n.id ? n : x) : [...ps, n]); setCur(n.id); alert('已還原：' + n.info.name); };
  const addProject = async n => { await Store.put(n); setProjects(ps => [...ps, n]); setCur(c => c || n.id); };
  const quick = pr => { setPreset(pr); setTab('insp'); };
  if (!projects) return html`<div className="empty">載入中…</div>`;
  const props = {p, C, update};
  return html`<div>
    <header><h1 style=${{display: "flex", alignItems: "center", gap: "10px"}}><img src=${LOGO_DARK} alt="Ironaudit" style=${{height: "30px"}} /><span style=${{fontSize: "13px", fontWeight: "normal", opacity: .75}}>智慧監造報表　v115.09.20-7</span></h1>
      <select value=${cur || ''} onChange=${e => setCur(e.target.value)}>${!projects.length && html`<option value="">（尚無專案）</option>`}${[...projects].sort((a, b) => seqCmp(a.info.name, b.info.name)).map(x => html`<option key=${x.id} value=${x.id}>${x.info.name}</option>`)}</select>
      <button className="b" onClick=${create}>＋ 新增專案</button>
      <button className="b" onClick=${() => setDrv(true)}>☁ 雲端導入</button></header>
    ${drv && html`<${DriveImport} existing=${projects} onCreate=${addProject} onClose=${() => setDrv(false)} />`}
    ${p ? html`<nav>${TABS.map(([k, t]) => html`<button key=${k} className=${tab === k ? 'on' : ''} onClick=${() => setTab(k)}>${t}</button>`)}</nav>
      <main>
        ${tab === 'home' && html`<${Dashboard} ...${props} go=${setTab} />`}
        ${tab === 'import' && html`<${ImportTab} ...${props} />`}
        ${tab === 'items' && html`<${ContractTab} ...${props} />`}
        ${tab === 'log' && html`<${LogTab} ...${props} />`}
        ${tab === 'insp' && html`<${InspectionTab} ...${props} preset=${preset} clearPreset=${() => setPreset(null)} />`}
        ${tab === 'tests' && html`<${TestTab} ...${props} />`}
        ${tab === 'tech' && html`<${TechTab} ...${props} />`}
        ${tab === 'check' && html`<${AuditRecTab} ...${props} />`}
        ${tab === 'forms' && html`<${FormTab} ...${props} />`}
        ${tab === 'audit' && html`<${AuditTab} ...${props} quick=${quick} />`}
        ${tab === 'set' && html`<${SettingsTab} ...${props} onDelete=${del} onRestore=${restore} />`}
      </main>`
    : html`<main><div className="card empty"><h2>歡迎使用 Ironaudit 智慧監造報表</h2><p>建立專案後，於「資料匯入」匯入契約詳細價目表、預定進度表與廠商施工日誌。</p>
        <div className="row" style=${{justifyContent: 'center'}}><button className="b p" onClick=${create}>＋ 新增專案</button>
        <label className="b" style=${{cursor: 'pointer'}}>從 JSON 備份還原<input type="file" accept=".json" style=${{display: 'none'}} onChange=${async e => { const f = e.target.files[0]; if (f) restore(JSON.parse(await f.text())); }} /></label></div></div></main>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
