<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1f2933;--mute:#6b7785;--line:#d9dee4;--pri:#1B2632;--pri2:#fdeee4;--acc:#F26B1D;--ok:#1a7f37;--okbg:#e6f4ea;--warn:#9a6700;--warnbg:#fff4d6;--bad:#cf222e;--badbg:#ffe5e5}
*{box-sizing:border-box}
body{margin:0;font-family:"Inter","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
header{background:#1B2632;color:#fff;padding:6px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1 1 auto;min-width:0}
header select{flex:1 1 100%;max-width:none;min-width:0;order:3}
.hbtn{display:flex;gap:6px;flex:0 0 auto;order:2}
header .hbtn button.b{white-space:nowrap;padding:4px 12px;font-size:13px;font-weight:500;border-radius:999px;background:rgba(255,255,255,.06);color:#e8edf2;border:1px solid rgba(255,255,255,.2);box-shadow:none}
header .hbtn button.b:hover{background:rgba(255,255,255,.14)}
header .hbtn button.b:first-child{color:#ffb27a;border-color:rgba(242,107,29,.7);background:rgba(242,107,29,.12)}
header .hbtn button.b:first-child:hover{background:rgba(242,107,29,.3);color:#fff}
header select{background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px}
header select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(242,107,29,.25)}
header select option{color:#1f2933;background:#fff}
.nw{white-space:nowrap;overflow-wrap:normal}
header h1{overflow:hidden;white-space:nowrap}
@media(max-width:560px){header .ver{display:none}}
nav{display:flex;gap:2px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line);padding:0 6px;position:sticky;top:0;z-index:5}
.subnav{display:flex;gap:4px;flex-wrap:wrap;background:#f7f9fb;border-bottom:1px solid var(--line);padding:4px 6px}
.subnav button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;font-size:13px;color:var(--mute);cursor:pointer}
.subnav button.on{background:var(--pri);border-color:var(--pri);color:#fff}
nav button{border:0;background:none;padding:7px 10px;cursor:pointer;font-size:15px;color:var(--mute);border-bottom:3px solid transparent}
nav button.on{color:var(--pri);border-bottom-color:var(--acc);font-weight:bold}
main{padding:8px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
/* ---- 總覽版面 ---- */
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.phead h2{font-size:17px;line-height:1.35;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12.5px;color:var(--mute)}
.chips b{color:var(--ink);font-weight:600;margin-left:4px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
.sect{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600;margin:0 0 8px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:10px}
.hero .big{font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.hero .sub{font-size:12px;color:var(--mute);margin-top:4px}
.track{margin-top:9px}
.track .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:3px}
.track .lab b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:999px;background:#eef1f5;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.tile .l{font-size:11.5px;color:var(--mute);line-height:1.3}
.tile .v{font-size:20px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.tile.on-bad{border-left-color:var(--bad)}.tile.on-bad .v{color:var(--bad)}
.tile.on-warn{border-left-color:var(--warn)}.tile.on-warn .v{color:var(--warn)}
.tile.on-ok{border-left-color:#cbd5e1}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.meta>div{flex:1 1 140px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.meta .l{font-size:11.5px;color:var(--mute)}.meta .v{font-size:15px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.card h2{font-size:15px;font-weight:600;margin:0 0 8px;letter-spacing:-.01em}
.card h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600;margin:12px 0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.kpi .rows{display:flex;flex-direction:column;gap:3px;margin-top:3px}
.kpi .rows>div{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kpi .rows .n{font-size:19px;font-weight:bold}
.info{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.info .k{color:var(--mute);white-space:nowrap}
.info .v{word-break:break-word}
.kpi .l{color:var(--mute);font-size:11.5px}.kpi .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--mute);font-weight:500}
label.f.wide{grid-column:1/-1}
input,select,textarea{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(242,107,29,.15)}
textarea{min-height:60px;resize:vertical}
button.b{font:inherit;font-weight:500;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.04);transition:background .12s}
button.b:hover{background:#f1f5f9}
button.p{background:var(--pri);color:#fff;border-color:var(--pri)}button.p:hover{background:#2c3b4a}
button.d{color:var(--bad);border-color:#f0b4b8}
button.s{padding:2px 8px;font-size:12px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
tbody tr:hover td{background:#f8fafc}
th{background:#f4f6f9;position:sticky;top:0;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
tr.g td{background:#f8fafc;font-weight:600;color:var(--pri)}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}.mute{color:var(--mute)}
.msg{padding:9px 12px;border-radius:8px;margin:8px 0;border-left:3px solid currentColor;font-size:13px}
.split{display:grid;grid-template-columns:220px 1fr;gap:14px}
.list{max-height:72vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.list div{padding:7px 10px;cursor:pointer;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;gap:6px;font-variant-numeric:tabular-nums}
.list div.on{background:var(--pri2);font-weight:600;box-shadow:inset 3px 0 0 var(--acc)}
.list div.mh{position:sticky;top:0;background:#eef1f4;font-weight:bold;color:var(--pri);border-bottom:1px solid var(--line)}
.pick{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff}
.pick label{display:flex;gap:6px;font-size:13px;padding:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;z-index:20;overflow:auto}
.modal>.card{width:min(960px,100%);box-shadow:0 12px 32px rgba(16,24,40,.18);border-radius:12px}
.empty{color:var(--mute);padding:26px 16px;text-align:center;font-size:13px}
@media(max-width:760px){.split{grid-template-columns:1fr}main{padding:6px}.list{max-height:40vh}.card{padding:8px;margin-bottom:6px}.kpis{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.kpi .v{font-size:19px}header h1 img{height:24px!important}}
.split>*{min-width:0;max-width:100%}
.xrow td{background:#f8fafc}.xrow div{padding:2px 0}
@media(max-width:760px){td,th{overflow-wrap:anywhere}.tw table{font-size:12.5px}}
@media print{header,nav,.subnav,.noprint{display:none}}
.psheets{display:none}
@media print{body{background:#fff}.psheets{display:block}main{padding:0;max-width:none}.sheet{break-after:page;font-size:12pt;color:#000}.sheet:last-child{break-after:auto}
.sheet .st{text-align:center;font-size:18pt;font-weight:bold;margin:0 0 10px}.sheet table{width:100%;border-collapse:collapse}
.sheet th,.sheet td{border:1px solid #000;padding:6px 8px;text-align:left;vertical-align:top}.sheet th{width:18%;background:#f2f2f2;white-space:nowrap;font-size:12pt;color:#000;font-weight:bold;text-transform:none;letter-spacing:0}
.sheet td.pre{white-space:pre-wrap;height:2.2em}.sheet .sg{display:flex;justify-content:space-between;gap:12px;margin-top:28px}.sheet .sg div{flex:1;border-bottom:1px solid #000;padding-bottom:28px}}
.tpl{width:100%;table-layout:fixed;border-collapse:collapse}.tpl td{border:1px solid #999;padding:2px 4px;font-size:12px;white-space:pre-wrap;word-break:break-all;vertical-align:middle;height:22px;cursor:pointer}
.tpl.plain td{border:none}.tpl td.m{background:#e0f2fe}.tpl td.tsel{outline:2px solid #2563eb;outline-offset:-2px}.tplf{color:#2563eb;font-size:11px}
@media print{.sheet table.tpl td{border:1px solid #000;padding:2px 4px;font-size:11pt;cursor:auto;height:auto}.sheet table.tpl.plain td{border:none}}
.pdfsheet{position:relative;container-type:inline-size}.pdfsheet img{width:100%;display:block}.pf{position:absolute;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;line-height:1.15;color:#000}
.pf.pfe{background:rgba(37,99,235,.18);color:#1d4ed8;cursor:pointer;outline:1px dashed #2563eb;min-height:1.3em;box-sizing:border-box}
</style>

const addDays = (s, n) => { const d = fromISO(s); d.setDate(d.getDate() + n); return toISO(d); };
const dayDiff = (a, b) => Math.round((fromISO(b) - fromISO(a)) / 864e5);

const WK = '日一二三四五六';
const wkday = s => WK[fromISO(s).getDay()];
const roc = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${+y - 1911}年${+m}月${+d}日`; };
const rocMD = s => { if (!s) return ''; const [, m, d] = s.split('-'); return `${+m}月${+d}日`; };
const mondayOf = s => { const d = fromISO(s); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return toISO(d); };
const num = v => { if (v == null || v === '') return NaN; if (typeof v === 'number') return v; const t = String(v).replace(/[,，\s%]/g, ''); return t === '' ? NaN : Number(t); };
const isNum = v => Number.isFinite(num(v));
const r4 = x => Math.round(x * 1e4) / 1e4;
const pct = (x, d = 2) => Number.isFinite(x) ? (x * 100).toFixed(d) + '%' : '—';
const money = x => Number.isFinite(x) ? Math.round(x).toLocaleString() : '—';
const fmtQ = x => Number.isFinite(x) ? (+x.toFixed(3)).toLocaleString() : '';
const norm = s => String(s ?? '').replace(/[\s　，,。．.、:：;；()（）\[\]【】「」'"＂]/g, '').replace(/[＜]/g, '<').replace(/[＞]/g, '>').replace(/[≧⩾]/g, '≥').replace(/[≦⩽]/g, '≤').replace(/[³]/g, '3').replace(/[²]/g, '2').toLowerCase();

/* 各種日期寫法 → ISO（Date 物件、Excel 序號、115/8/3、115.08.03、2026-8-3、1150803） */
function parseAnyDate(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date && !isNaN(v)) { const d = new Date(v.getTime() + 12 * 36e5); return toISO(new Date(d.getFullYear(), d.getMonth(), d.getDate())); }
  if (typeof v === 'number') { if (v > 20000 && v < 80000) { const d = XLSX.SSF.parse_date_code(v); return `${d.y}-${pad(d.m)}-${pad(d.d)}`; } return null; }
  let s = String(v).trim().replace(/[年月]/g, '/').replace(/日.*$/, '').replace(/\(.+?\)|（.+?）/g, '').trim();
  let m = s.match(/^(\d{2,4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/);
  if (!m) { const k = s.match(/^(\d{3})(\d{2})(\d{2})$/); if (k) m = [0, k[1], k[2], k[3]]; }
  if (!m) return null;
  let y = +m[1]; if (y < 1911) y += 1911;
  const mo = +m[2], d = +m[3]; if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  return `${y}-${pad(mo)}-${pad(d)}`;
}

/* ================= 資料儲存層 =================
   目前以瀏覽器 IndexedDB 保存，每個專案一份文件。
   日後併入 RT-PMIS 時，只需把 Store 的四個函式換成 Supabase 呼叫。 */
const Store = (() => {
  let dbp;
  const db = () => dbp || (dbp = new Promise((res, rej) => {
    const q = indexedDB.open('smart-supervision', 1);
    q.onupgradeneeded = () => q.result.createObjectStore('projects', {keyPath: 'id'});
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  }));
  const tx = async (mode, fn) => { const d = await db(); return new Promise((res, rej) => { const t = d.transaction('projects', mode); const r = fn(t.objectStore('projects')); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); };
  return {
    list: () => tx('readonly', s => s.getAll()),
    put: doc => tx('readwrite', s => s.put(doc)),
    del: id => tx('readwrite', s => s.delete(id)),
  };
})();

/* 表單編碼（施工抽查紀錄表 E＋工程類別代碼）：A 測量、B 開挖、C 回填、D 鋼筋、E 模板、F 混凝土、G 臨時擋土設施、H 預力混凝土基樁、I 臨時擋抽移排水、J 瀝青混凝土鋪面、K 控制性低強度回填材料(CLSM)、L 植筋、M 混凝土塊、N 坡面工、

const DEFAULT_PREFIX = {施工查驗: 'E', 材料查驗: 'E', 技師督導: 'RT', 查核: 'RQ', 職安衛: 'EU', 環保: 'EV', 交維: 'EW', 防汛: 'EX'};
const OLD_PREFIX = {施工查驗: ['施查', 'E1'], 材料查驗: ['材查', 'E2'], 技師督導: ['技督'], 查核: ['查核', 'N'], 職安衛: ['安', 'E3'], 環保: ['環', 'E4'], 交維: ['交', 'E5'], 防汛: ['汛']};
function newProject(name = '新專案') {
  return {
    id: uid(), created: new Date().toISOString(),
    info: {name, contractNo: '', owner: '', supervisor: '睿泰工程顧問有限公司', contractor: '', location: '', startDate: todayISO(), duration: 180, extendDays: 0, amount: 0},
    items: [], schedule: [], logs: {}, inspections: [], supervisions: [], forms: [], flags: [],
    settings: {prefix: {...DEFAULT_PREFIX}, tolerance: 3, testDue: 30, labor: ['技術工', '大工', '小工'], machines: ['挖土機', '混凝土車', '吊(卡)車']},

/* ================= 匯入解析 ================= */
const readWB = async file => XLSX.read(await file.arrayBuffer(), {type: 'array', cellDates: true});
const aoa = ws => XLSX.utils.sheet_to_json(ws, {header: 1, raw: true, defval: null, blankrows: true});
const CN_NUM = /^[一二三四五六七八九十]+$/;
const RATIO_RE = /利潤|營業稅/;
const NO_INSPECT_RE = /品質|品管|職業安全|職安|環境保護|環保|交通維持|保險|利潤|營業稅/;

/* ---- 契約詳細價目表 ---- */
function parseContractSheet(rows) {
  let hi = -1, col = {};
  for (let i = 0; i < Math.min(rows.length, 30) && hi < 0; i++) {
    const h = rows[i].map(clean);
    const f = re => h.findIndex(x => re.test(x));
    const c = {seq: f(/^項次$/), name: f(/項目|說明/), unit: f(/^單位$/), qty: f(/數量/), price: f(/單價/)};
    if (c.seq >= 0 && c.unit >= 0 && c.qty >= 0 && c.price >= 0) {
      hi = i; col = c; col.code = f(/代碼/); col.kind = f(/^類型$/); col.inspect = f(/需查驗/); col.amount = f(/複價|總價|^金額$/);
      if (col.name === col.seq) col.name = f(/工程項目|說明/);
    }
  }
  if (hi < 0) return null;
  const items = []; let group = '', gseq = '', gi = -1, n = 0;
  const letter = i => String.fromCharCode(65 + i);
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i], seq = clean(r[col.seq]), name = String(r[col.name] ?? '').trim(), unit = clean(r[col.unit]);
    const qty = num(r[col.qty]), price = num(r[col.price]);
    if (/總價|總計|合計/.test(clean(name)) && !unit) continue;
    const isItem = unit && Number.isFinite(qty) && qty > 0 && Number.isFinite(price);
    if (CN_NUM.test(seq)) { gi++; n = 0; group = name; gseq = seq; }
    if (!isItem) continue;
    n++;
    const code = col.code >= 0 && clean(r[col.code]) ? clean(r[col.code]) : letter(Math.max(gi, 0)) + pad(n);
    const kind = col.kind >= 0 && clean(r[col.kind]) ? (clean(r[col.kind]) === '比例' ? 'ratio' : 'normal') : (RATIO_RE.test(name) && unit === '式' ? 'ratio' : 'normal');
    const inspect = col.inspect >= 0 && r[col.inspect] != null ? /^(是|Y|y|v|V|✓|1|TRUE|true)$/.test(clean(r[col.inspect])) : (kind === 'normal' && !NO_INSPECT_RE.test(group));
    items.push({code, seq, name, unit, qty, price, amount: col.amount >= 0 && isNum(r[col.amount]) ? num(r[col.amount]) : Math.round(qty * price), group, gseq, kind, inspect});
  }
  return items;
}
/* 日誌側（工程項目矩陣／日資料庫）的工項名稱，用來驗證價目表分頁是否屬於本案 */
function logItemNames(wb) {
  const out = new Set();
  const push = (r, from) => { if (r) r.forEach((v, c) => { if (c >= from && v && !/合計|利雜費|總和$|^營業稅$/.test(clean(v))) out.add(norm(v)); }); };
  if (wb.Sheets['工程項目']) { const rows = aoa(wb.Sheets['工程項目']); const nr = rows.findIndex(r => clean(r[0]) === '工程項目'); if (nr >= 0) push(rows[nr], 3); }
  for (const sn of wb.SheetNames) if (/^日資料庫/.test(sn)) { const R = aoa(wb.Sheets[sn]); const nr = R.findIndex(r => clean(r[0]) === '工項'); if (nr >= 0) push(R[nr], 6); }
  out.delete('');
  return [...out];
}
const isHidden = (wb, si) => !!wb.Workbook?.Sheets?.[si]?.Hidden; // 隱藏分頁多半是別案複製後留下的樣板
function parseContract(wb) {
  const refs = logItemNames(wb); // 同一活頁簿常殘留其他案的價目表分頁，以日誌工項名稱吻合數為第一順位
  let best = null;
  for (const [si, sn] of wb.SheetNames.entries()) {
    const rows = aoa(wb.Sheets[sn]);
    const items = parseContractSheet(rows);
    if (!items || !items.length) continue;
    const set = new Set(items.map(x => norm(x.name)));
    const hit = refs.filter(n => set.has(n)).length;
    const score = (isHidden(wb, si) ? -1e6 : 0) + hit * 100 + items.length
      + (/詳細|契約/.test(sn) ? 5 : 0) + (/^契約/.test(sn) ? 2 : 0) + (items.some(x => /^[A-Z]\d{2}$/.test(x.code)) ? 3 : 0);
    if (!best || score > best.score) best = {sheet: sn, items, score, hit, refs: refs.length, name: sheetProjName(rows.slice(0, 15))};
  }
  return best;
}
/* 工程資料：「工程資料」分頁，或施工日誌表頭（工程名稱／承攬廠商名稱／契約工期／開工日期…）的「標籤→右側值」 */
const INFO_MAP = [[/^工程名稱/, 'name'], [/^契約編號|^工程編號/, 'contractNo'], [/^主辦機關/, 'owner'], [/^監造單位/, 'supervisor'], [/^承[攬包]廠商/, 'contractor'],
  [/^開工日期/, 'startDate'], [/^完工期限|^契約工期/, 'duration'], [/^契約金額/, 'amount'], [/^展延工期|^工期展延天數/, 'extendDays'], [/^施工地點/, 'location']];
function infoFromRows(rows, info = {}) {
  for (const r of rows) for (let i = 0; i < r.length; i++) {
    const lab = clean(r[i]).replace(/[:：]$/, ''); if (!lab || lab.length > 8) continue;
    const hit = INFO_MAP.find(([re]) => re.test(lab)); if (!hit || info[hit[1]] != null) continue;
    const k = hit[1]; let v = null;
    for (let j = i + 1; j < Math.min(r.length, i + 8); j++) { if (r[j] == null || String(r[j]).trim() === '') continue; if (INFO_MAP.some(([re]) => re.test(clean(r[j])))) break; v = r[j]; break; }
    if (v == null) continue;
    if (k === 'startDate') { const d = parseAnyDate(v); if (d) info[k] = d; }
    else if (['duration', 'amount', 'extendDays'].includes(k)) { const m = String(v).replace(/,/g, '').match(/\d+(\.\d+)?/); if (m) info[k] = +m[0]; }
    else info[k] = String(v).trim();

}
/* 工程資料常是從別案複製後忘了更新，故以契約分頁的工程名稱為準：名稱不符者整個略過，空白樣板分頁亦然 */
const PLACEHOLDER = /[○◯〇□]{2}/;
function sheetProjName(rows) {
  for (const r of rows) for (let i = 0; i < r.length; i++) {
    const t = String(r[i] ?? '').trim(); if (!t) continue;
    const inline = t.match(/工程名稱\s*[:：]\s*(\S.*)$/); if (inline) return inline[1].trim(); // 「第二聯　工程名稱：○○」同格
    if (clean(t).replace(/[:：]$/, '') !== '工程名稱') continue;
    for (let j = i + 1; j < Math.min(r.length, i + 8); j++) { const v = String(r[j] ?? '').trim(); if (v) return v; }
  }
  return null;
}
function parseInfo(wb, mainName) {
  const ref = norm(mainName || '');
  const good = [], unknown = [];
  for (const sn of wb.SheetNames) {
    const raw = aoa(wb.Sheets[sn]).slice(0, 15);
    const nm0 = sheetProjName(raw);
    if (nm0 && PLACEHOLDER.test(nm0)) continue; // 「○○排水○○分線工程」之類的空白樣板分頁
    const rows = raw.map(r => r.map(v => PLACEHOLDER.test(String(v ?? '')) ? null : v));
    const n = norm(nm0 || '');
    if (nm0 && ref && !(n === ref || n.startsWith(ref) || ref.startsWith(n))) continue; // 別案殘留分頁
    (nm0 ? good : unknown).push([sn, rows]);
  }
  const order = [...good, ...unknown];
  const di = order.findIndex(([sn]) => sn === '工程資料'); // 工程資料若未被判為別案，優先採用
  if (di > 0) order.unshift(...order.splice(di, 1));
  const info = {};
  for (const [sn, rows] of order) infoFromRows(sn === '工程資料' ? rows.map(r => r.slice(0, 3)) : rows, info);
  return info;
}

/* ---- 預定進度表 ---- */
function toFrac(vals) { const mx = Math.max(...vals.map(v => v[1])); return vals.map(([d, v]) => ({date: d, cum: mx > 1.5 ? v / 100 : v})); }
function dedupSchedule(pts) {
  const m = new Map(); pts.forEach(p => m.set(p.date, p.cum));
  const a = [...m].map(([date, cum]) => ({date, cum: Math.round(cum * 1e6) / 1e6})).sort((x, y) => x.date < y.date ? -1 : 1);
  const k = a.findIndex(x => x.cum >= a[a.length - 1].cum); return a.slice(0, k + 1); // 去除達 100% 後的重複點
}
function parseSchedule(wb) {
  const cands = [];
  for (const [si, sn] of wb.SheetNames.entries()) {
    if (wb.Workbook?.Sheets?.[si]?.Hidden) continue; // 略過隱藏分頁
    scheduleCands(aoa(wb.Sheets[sn]), sn, cands);
  }
  const ok = cands.filter(c => c.points.length >= 3); // 去重後不足 3 點者多為誤判（如矩陣中偶然的一格數字）
  ok.sort((a, b) => b.points.length - a.points.length);
  return ok[0] || null;
}
function scheduleCands(rows, sn, cands) {
  {
    if (!rows.length) return cands;
    const H = Math.min(rows.length, 8), W = Math.max(...rows.slice(0, 400).map(r => r.length));
    // (A) 直式：表頭含「預定」且「累計」的欄 + 日期欄
    const hdr = [];
    for (let i = 0; i < H; i++) { let last = '', lc = -9; hdr[i] = []; for (let c = 0; c < W; c++) { const v = clean(rows[i][c]); if (v) { last = v; lc = c; } hdr[i][c] = v || (c - lc <= 1 ? last : ''); } } // 合併表頭只往右延伸 1 格
    for (let c = 0; c < W; c++) {
      const t = hdr.map(h => h[c] || '').join('|');
      if (!(/預定/.test(t) && /累計/.test(t))) continue;
      if (/實際/.test(clean(rows.slice(0, H).map(r => r[c]).join('')))) continue;
      let dc = -1, best = 0;
      for (let k = 0; k < Math.min(W, 6); k++) { const n = rows.slice(1).filter(r => parseAnyDate(r[k])).length; if (n > best) { best = n; dc = k; } }
      if (dc < 0 || best < 3) continue;
      const vals = rows.slice(1).map(r => [parseAnyDate(r[dc]), num(r[c])]).filter(([d, v]) => d && Number.isFinite(v));
      if (vals.some((v, i) => i && v[1] < vals[i - 1][1] - 1e-6)) continue; // 累計值必須遞增（排除「當日」欄）
      if (vals.length >= 3) cands.push({sheet: sn, how: '直式欄位', points: dedupSchedule(toFrac(vals))});
    }
    // (B) 橫式：某列標示「累計」、上方有一列日期
    for (let i = 0; i < rows.length; i++) {
      const labOf = r => (r || []).slice(0, 4).filter(v => !isNum(v)).map(clean).join('');
      let lab = labOf(rows[i]); if (!/累計/.test(lab)) lab += labOf(rows[i - 1]) + labOf(rows[i + 1]); // 列標題折行
      if (!/累計/.test(lab) || /實際/.test(lab)) continue;
      const numCols = rows[i].map((v, c) => c > 0 && isNum(v) ? c : -1).filter(c => c >= 0);
      if (numCols.length < 3) continue;
      for (let j = i - 1; j >= Math.max(0, i - 8); j--) {
        const pairs = numCols.map(c => [parseAnyDate(rows[j][c]), num(rows[i][c])]).filter(([d]) => d);
        if (pairs.length >= 3) { cands.push({sheet: sn, how: '橫式列', points: dedupSchedule(toFrac(pairs))}); break; }
      }
    }
  }
  return cands;
}
function parsePastedSchedule(text) {
  const vals = text.split(/\r?\n/).map(l => l.split(/\t|,|\s{2,}/)).map(c => [parseAnyDate(c[0]), num(c[1])]).filter(([d, v]) => d && Number.isFinite(v));
  return vals.length ? dedupSchedule(toFrac(vals)) : [];
}

/* ---- 施工日誌 ---- */
let ALIAS = {}; // 使用者手動指定的「日誌名稱 → 契約代碼」，匯入前由專案設定帶入
/* 契約名稱常有分類前綴（「品質管理，試驗規範及標準，土木工程及建築類檢驗，A3045…」），日誌只印末段。
   字尾相符僅在整份契約唯一相符時才採用，避免誤配。 */
function endsWithOne(items, n) {
  if (n.length < 6) return [];
  const c = items.filter(x => norm(x.name).endsWith(n));
  return c.length === 1 ? c : [];
}
/* 契約名稱常在括號內補計算式（「營業稅（約壹．一～壹．八總和之5%)」），日誌只寫括號前的本名 */

function matchItem(items, name, unit) {
  const n = norm(name); if (!n) return null;
  if (ALIAS[n]) { const a = items.find(x => x.code === ALIAS[n]); if (a) return a; }
  let c = items.filter(x => norm(x.name) === n);
  if (!c.length) c = parenBase(items, n);
  if (!c.length && n.length >= 6) c = items.filter(x => { const m = norm(x.name); return m.startsWith(n) || n.startsWith(m); });
  if (!c.length) c = endsWithOne(items, n);
  if (c.length > 1 && unit) { const u = c.filter(x => norm(x.unit) === norm(unit)); if (u.length) c = u; }
  return c[0] || null;
}
const blankLog = () => ({wAm: '', wPm: '', summary: '', safety: '', tests: '', notify: '', notes: '', labor: {}, machines: {}, qty: {}});
function parseLogs(wb, items) {
  const logs = {}, unmatched = [], sources = [];
  const L = d => logs[d] || (logs[d] = blankLog());
  const S = n => wb.Sheets[n] ? aoa(wb.Sheets[n]) : null;
  // (1) 本系統匯出之整合連動版
  let rows = S('每日數量');
  if (rows && clean(rows[0]?.[0]) === '代碼') {
    const codes = rows[0]; let n = 0;
    for (let i = 7; i < rows.length; i++) { const d = parseAnyDate(rows[i][0]); if (!d) continue;
      for (let c = 7; c < codes.length; c++) { const q = num(rows[i][c]); const code = clean(codes[c]); if (code && Number.isFinite(q) && q !== 0 && items.find(x => x.code === code)?.kind === 'normal') { L(d).qty[code] = q; n++; } } }
    sources.push(`每日數量：${n} 筆數量`);
  } else if ((rows = S('工程項目'))) {
    // (2) 既有整合活頁簿（工程項目矩陣：列=日期、欄=工項）
    const nr = rows.findIndex(r => clean(r[0]) === '工程項目'), ur = rows.findIndex(r => clean(r[0]) === '日期');
    if (nr >= 0 && ur >= 0) {
      const map = {};
      const miss = {};
      rows[nr].forEach((v, c) => { if (c < 3 || !v || /合計|利雜費|總和$|^營業稅$/.test(clean(v))) return; const it = matchItem(items, v, rows[ur][c]); if (it) map[c] = it.code; else miss[c] = String(v); });
      let n = 0, prev = '';

async function pdfPageLines(page) {
  const tc = await page.getTextContent();
  const it = tc.items.filter(i => i.str && i.str.trim()).map(i => ({t: i.str, x0: i.transform[4], x1: i.transform[4] + i.width, y: i.transform[5], h: Math.abs(i.transform[3]) || 10}));

function RecordTab({p, update, listKey, title, fields, cols, filter, defaults, prefixKey, preset, clearPreset, note}) {

function SCurve({p, C}) {
  const s = p.info.startDate, di = dayInfo(p, s); if (!s || !di.total) return null;
  const W = 760, H = 240, M = 36, X = d => M + (W - 2 * M) * Math.min(1, Math.max(0, dayDiff(s, d) / di.total)), Y = v => H - M + (M * 2 - H) * v;
  const sp = [{date: addDays(s, -1), cum: 0}, ...p.schedule]; const act = C.series.filter(x => x.date <= (C.last?.date || ''));
  const line = (pts, k) => pts.map(x => `${X(x.date).toFixed(1)},${Y(x[k]).toFixed(1)}`).join(' ');
  return html`<svg viewBox=${`0 0 ${W} ${H}`} style=${{width: '100%'}}>
    ${[0, .25, .5, .75, 1].map(v => html`<g key=${v}><line x1=${M} x2=${W - M} y1=${Y(v)} y2=${Y(v)} stroke="#e3e7ec" /><text x=${M - 4} y=${Y(v) + 4} fontSize="10" textAnchor="end" fill="#6b7785">${v * 100}%</text></g>`)}
    <text x=${M} y=${H - 12} fontSize="10" fill="#6b7785">${roc(s)}</text><text x=${W - M} y=${H - 12} fontSize="10" textAnchor="end" fill="#6b7785">${roc(di.end)}</text>
    ${p.schedule.length > 0 && html`<polyline points=${line(sp, 'cum')} fill="none" stroke="#94a3b8" strokeWidth="2" strokeDasharray="5 4" />`}
    ${act.length > 0 && html`<polyline points=${line(act, 'cum')} fill="none" stroke="#F26B1D" strokeWidth="2.5" />`}
    <g fontSize="11"><line x1=${W - 220} x2=${W - 196} y1=${M - 14} y2=${M - 14} stroke="#94a3b8" strokeWidth="2" strokeDasharray="5 4" /><text x=${W - 192} y=${M - 10}>預定</text>
    <line x1=${W - 150} x2=${W - 126} y1=${M - 14} y2=${M - 14} stroke="#F26B1D" strokeWidth="2.5" /><text x=${W - 122} y=${M - 10}>實際</text></g></svg>`;
}
function Dashboard({p, C, go}) {

  </div>`;
}

/* 名稱對不到的工項：列出建議對應，使用者確認後併入並記住 */
function UnmatchedMap({list, items, amap, setAmap}) {
  const g = {}; list.forEach(u => { const k = norm(u.name); (g[k] = g[k] || {name: u.name, unit: u.unit, q: 0, days: new Set()}); g[k].q += u.q; g[k].days.add(u.date); });
  return html`<div className="msg warn"><b>以下名稱與契約項目不完全相同，請確認對應（選好後按確認匯入，下次會自動對應）：</b>
    <table style=${{marginTop: '6px', background: '#fff'}}><thead><tr><th>日誌上的名稱</th><th>單位</th><th className="n">合計數量</th><th className="n">天數</th><th>對應契約項目</th></tr></thead><tbody>
    ${Object.entries(g).map(([k, x]) => html`<tr key=${k}><td>${x.name}</td><td>${x.unit}</td><td className="n">${fmtQ(x.q)}</td><td className="n">${x.days.size}</td>
      <td><select style=${{maxWidth: '360px'}} value=${amap[k] || ''} onChange=${e => setAmap({...amap, [k]: e.target.value})}><option value="">（不匯入）</option>
        ${items.map(it => html`<option key=${it.code} value=${it.code}>${it.code} ${it.name}（${it.unit}）</option>`)}</select></td></tr>`)}
    </tbody></table></div>`;
}
/* 相似度（字元二元組 Dice 係數）＋單位相同加分，取最接近的契約項目 */
function suggestItem(items, name, unit) {
  const bg = s => { const t = norm(s).replace(/祛/g, '袪'), a = new Map(); for (let i = 0; i < t.length - 1; i++) { const k = t.slice(i, i + 2); a.set(k, (a.get(k) || 0) + 1); } return [a, Math.max(1, t.length - 1)]; };
  const [A, na] = bg(name); let best = null, bs = 0;
  for (const it of items) { const [B, nb] = bg(it.name); let o = 0; A.forEach((v, k) => o += Math.min(v, B.get(k) || 0));
    const sc = 2 * o / (na + nb) + (unit && norm(unit) === norm(it.unit) ? 0.1 : 0); if (sc > bs) { bs = sc; best = it; } }
  return bs >= 0.45 ? best : null;
}

/* 依頻率產生空白表單：技師督導、防汛每月 1 次；職安衛、交維每週 1 次（可調整），從開工日排到完工日（或今天），已有紀錄的期間不重複產生 */

function FolderList({sb}) {

      sb.from('folder_requirements').select('*'),

    if (e) { setErr(e.message); setLoading(false); return; }

  }, [sb]);

  /* 同事改的數字即時出現；公司網路擋掉 WebSocket 時按「重新整理」也拿得到 */
  useEffect(() => {
    const ch = sb.channel('folder-req').on('postgres_changes', {event: '*', schema: 'public', table: 'folder_requirements'}, ev => {
      setRows(cur => {
        if (ev.eventType === 'DELETE') return cur.filter(x => x.id !== ev.old.id);
        const i = cur.findIndex(x => x.id === ev.new.id);

      <div className="hero">
        <div><div className="big">${total.toLocaleString()}</div><div className="sub">個資料夾　${filled}／${list.length} 個工程已填</div></div>

        <button className="b" onClick=${addProject}>＋ 其他工程</button>

      </div>

    </div>

      <thead><tr><th>工程</th><th className="n">數量</th><th>更新</th></tr></thead>

async function driveFetch(tok, url) { const r = await fetch(url, {headers: {Authorization: 'Bearer ' + tok}}); if (!r.ok) throw new Error(`Drive ${r.status}：${(await r.text()).slice(0, 160)}`); return r; }

async function parseReportFiles(files, p) {

    if (exist && !confirm('已有相同專案，要以備份內容覆蓋嗎？')) return; const n = {...newProject(), ...doc, settings: {...newProject().settings, ...doc.settings}}; migrateProject(n); await Store.put(n);
    setProjects(ps => exist ? ps.map(x => x.id === n.id ? n : x) : [...ps, n]); setCur(n.id); alert('已還原：' + n.info.name); };
  const addProject = async n => { await Store.put(n); setProjects(ps => [...ps, n]); setCur(c => c || n.id); };
  const replaceProject = async n => { await Store.put(n); setProjects(ps => ps.map(x => x.id === n.id ? n : x)); };
  const quick = pr => { setPreset(pr); setTab('insp'); };
  if (!projects) return html`<div className="empty">載入中…</div>`;
  const props = {p, C, update};
  return html`<div>
    <header><h1 style=${{display: "flex", alignItems: "center", gap: "10px"}}><img src=${LOGO_DARK} alt="Ironaudit" style=${{height: "30px"}} /><span className="ver" style=${{fontSize: "13px", fontWeight: "normal", opacity: .75}}>智慧監造報表　v115.09.21-3</span></h1>
      <div className="hbtn"><button className="b" onClick=${create}>＋ 新增</button>
      <button className="b" onClick=${() => setDrv(true)}>☁ 雲端導入</button></div>
      <select value=${cur || ''} onChange=${e => setCur(e.target.value)}>${!projects.length && html`<option value="">（尚無專案）</option>`}${[...projects].sort((a, b) => seqCmp(a.info.name, b.info.name)).map(x => html`<option key=${x.id} value=${x.id}>${x.info.name}</option>`)}</select></header>
    ${drv && html`<${DriveImport} existing=${projects} onCreate=${addProject} onReplace=${replaceProject} onClose=${() => setDrv(false)} />`}
    ${p ? html`<nav>${GROUPS.map(([g, ks]) => html`<button key=${g} className=${ks.includes(tab) ? 'on' : ''} onClick=${() => setTab(ks[0])}>${g}</button>`)}</nav>
      ${(GROUPS.find(([, ks]) => ks.includes(tab))?.[1] || []).length > 1 && html`<div className="subnav">${GROUPS.find(([, ks]) => ks.includes(tab))[1].map(k => html`<button key=${k} className=${tab === k ? 'on' : ''} onClick=${() => setTab(k)}>${TABS.find(t => t[0] === k)[1]}</button>`)}</div>`}
      <main>
        ${tab === 'home' && html`<${Dashboard} ...${props} go=${setTab} />`}
        ${tab === 'import' && html`<${ImportTab} ...${props} />`}
        ${tab === 'items' && html`<${ContractTab} ...${props} />`}
        ${tab === 'log' && html`<${LogTab} ...${props} />`}
        ${tab === 'insp' && html`<${InspectionTab} ...${props} preset=${preset} clearPreset=${() => setPreset(null)} />`}
        ${tab === 'tests' && html`<${TestTab} ...${props} />`}
        ${tab === 'tech' && html`<${TechTab} ...${props} />`}
        ${tab === 'check' && html`<${AuditRecTab} ...${props} />`}
        ${tab === 'forms' && html`<${FormTab} ...${props} />`}
        ${tab === 'print' && html`<${PrintTab} ...${props} />`}
        ${tab === 'audit' && html`<${AuditTab} ...${props} quick=${quick} />`}
        ${tab === 'folder' && html`<${FolderTab} />`}
        ${tab === 'set' && html`<${SettingsTab} ...${props} onDelete=${del} onRestore=${restore} />`}
      </main>`
    : html`<main><div className="card empty"><h2>歡迎使用 Ironaudit 智慧監造報表</h2><p>建立專案後，於「資料匯入」匯入契約詳細價目表、預定進度表與廠商施工日誌。</p>
        <div className="row" style=${{justifyContent: 'center'}}><button className="b p" onClick=${create}>＋ 新增專案</button>
        <label className="b" style=${{cursor: 'pointer'}}>從 JSON 備份還原<input type="file" accept=".json" style=${{display: 'none'}} onChange=${async e => { const f = e.target.files[0]; if (f) restore(JSON.parse(await f.text())); }} /></label></div></div></main>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
